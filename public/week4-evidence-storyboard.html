<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyboard: Evidence Types</title>
<style>
  :root {
    --bg0: #0a0a1a;
    --bg1: #1a1a2e;
    --text: #e0e0e0;
    --text-soft: #a0a0b0;
    --text-faint: #6b6b80;
    --accent: #6366f1;
    --panel: rgba(255, 255, 255, 0.05);
    --panel-border: rgba(255, 255, 255, 0.12);
    --box-border: rgba(255, 255, 255, 0.22);
    --success: #22c55e;
    --focus: #818cf8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg0) 0%, var(--bg1) 100%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.5;
    font-size: 17px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 28px 64px; }

  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  button { font-family: inherit; }

  /* ---------- Header ---------- */
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 28px;
  }
  .brand h1 {
    font-size: clamp(24px, 3vw, 34px); font-weight: 800; margin: 0;
    letter-spacing: -0.02em; line-height: 1.1;
  }
  .brand h1 .accent { color: var(--accent); }
  .brand .sub { color: var(--text-soft); font-size: 15px; margin-top: 6px; max-width: 58ch; }

  .lang-toggle {
    display: inline-flex; align-items: center;
    border: 1px solid var(--panel-border); border-radius: 8px; overflow: hidden;
    background: var(--panel); flex-shrink: 0;
  }
  .lang-toggle button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    padding: 10px 18px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.12em; color: var(--text-soft);
    transition: color 0.2s ease, background 0.2s ease;
  }
  .lang-toggle button + button { border-left: 1px solid var(--panel-border); }
  .lang-toggle button[aria-pressed="true"] { color: #fff; background: rgba(99, 102, 241, 0.35); }

  /* ---------- Framing panel (home) ---------- */
  .framing {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 22px 26px; margin-bottom: 30px;
  }
  .framing .eyebrow {
    text-transform: uppercase; font-size: 12px; font-weight: 700;
    letter-spacing: 0.18em; color: var(--accent); margin: 0 0 8px;
  }
  .framing p { margin: 0; font-size: 18px; max-width: 68ch; }

  .home-prompt { font-size: 18px; font-weight: 600; color: var(--text-soft); margin: 0 0 16px; }

  /* ---------- Story card grid ---------- */
  .home-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
  }
  .story-card {
    display: block; text-align: left; cursor: pointer;
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 20px 20px 18px;
    color: var(--text); text-decoration: none;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
  }
  .story-card:hover, .story-card:focus-visible {
    border-color: var(--card-c, var(--accent));
    background: rgba(255, 255, 255, 0.08);
    transform: translateY(-2px);
  }
  .story-card .card-icon { display: block; margin-bottom: 12px; }
  .story-card .card-icon svg { display: block; }
  .story-card .card-name { display: block; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  .story-card .card-crime { display: block; color: var(--text-soft); font-size: 15px; margin-top: 2px; }
  .story-card .card-group { display: block; margin-top: 10px; font-size: 12px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--card-c, var(--accent));
  }
  /* ---------- Story page ---------- */
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    background: none; border: 1px solid var(--panel-border); border-radius: 8px;
    color: var(--text-soft); font-size: 14px; font-weight: 600;
    padding: 8px 14px; cursor: pointer; margin-bottom: 18px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .back-link:hover { color: #fff; border-color: var(--accent); }

  .story-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  .story-head .head-icon { flex-shrink: 0; }
  .story-head h2 { margin: 0; font-size: clamp(24px, 3vw, 32px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .story-head .crime-tag {
    display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--story-c, var(--accent));
  }

  .story-text {
    background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 22px 26px; margin-bottom: 20px;
  }
  .story-text p { margin: 0; font-size: 17.5px; max-width: 72ch; }
  .story-text p + p { margin-top: 14px; }

  .task-bar {
    border-left: 4px solid var(--accent);
    background: rgba(99, 102, 241, 0.10);
    border-radius: 0 10px 10px 0;
    padding: 14px 20px; margin-bottom: 22px;
    font-size: 17px; max-width: 78ch;
  }
  .task-bar strong { color: #c7c9ff; }

  /* ---------- Evidence boxes ---------- */
  .boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .boxes { grid-template-columns: 1fr; } }
  .ev-box {
    border: 2px dashed var(--box-border); border-radius: 14px;
    padding: 16px 18px; min-height: 170px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .ev-box .box-label {
    font-size: 13px; font-weight: 800; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-soft);
  }
  .ev-box .box-body { flex: 1; }
  .ev-box .box-hint { color: var(--text-faint); font-size: 14px; font-style: italic; }
  .ev-box.filled { border-style: solid; border-color: var(--success); background: rgba(34, 197, 94, 0.06); }
  .ev-box .box-label.filled-label { color: var(--success); }
  .ev-box .answer { font-size: 16px; line-height: 1.5; }
  .ev-box .answer .ans-why { color: var(--text-soft); }

  /* ---------- Teacher toggle ---------- */
  .teacher-bar {
    margin-top: 24px; padding-top: 16px;
    border-top: 1px solid var(--panel-border);
    display: flex; align-items: center; gap: 10px;
  }
  .teacher-bar .t-label { font-size: 13px; color: var(--text-faint); font-weight: 600; }
  .switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute; inset: 0; cursor: pointer;
    background: rgba(255, 255, 255, 0.12); border: 1px solid var(--panel-border);
    border-radius: 26px; transition: background 0.2s ease;
  }
  .switch .slider::before {
    content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
    left: 3px; top: 3px; background: #cfcfda; transition: transform 0.2s ease, background 0.2s ease;
  }
  .switch input:checked + .slider { background: rgba(34, 197, 94, 0.35); border-color: var(--success); }
  .switch input:checked + .slider::before { transform: translateX(20px); background: var(--success); }
  .switch input:focus-visible + .slider { outline: 2px solid var(--focus); outline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><span class="accent" id="brand-title">Storyboard</span></h1>
      <div class="sub" id="brand-sub"></div>
    </div>
    <div class="lang-toggle no-print" role="group" aria-label="Language">
      <button type="button" id="lang-en" aria-pressed="true">EN</button>
      <button type="button" id="lang-es" aria-pressed="false">ES</button>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<script>

/* Icon motifs, drawn once, tinted per story via currentColor. */
function icon(kind, size, color) {
  size = size || 40; color = color || "#6366f1";
  var s = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 48 48" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">';

    s += '<rect x="14" y="14" width="14" height="28" rx="2"/>'

      + '<rect x="18" y="8" width="6" height="6"/>'
      + '<path d="M28 9h6M28 12h8M28 15h6"/>'
      + '<circle cx="17" cy="13" r="1" fill="' + color + '"/>';
  } else if (kind === "invoice") {

    s += '<rect x="8" y="14" width="32" height="22" rx="3"/>'

      + '<rect x="28" y="24" width="12" height="8" rx="2"/>'
      + '<circle cx="32" cy="28" r="1" fill="' + color + '"/>';
  } else if (kind === "car") {
    s += '<path d="M8 30l3-10a3 3 0 013-2h20a3 3 0 013 2l3 10"/>'
      + '<rect x="6" y="30" width="36" height="9" rx="2"/>'
      + '<circle cx="15" cy="39" r="3"/>'
      + '<circle cx="33" cy="39" r="3"/>';
  } else if (kind === "flood") {
    s += '<rect x="10" y="6" width="28" height="24" rx="2"/>'
      + '<path d="M16 14h16M16 20h10"/>'
      + '<path d="M8 36c3-3 6-3 9 0s6 3 9 0 6-3 9 0 5 3 6 2"/>';
  } else if (kind === "fire") {
    s += '<path d="M14 20h20l-2 20H16z"/>'
      + '<path d="M19 20v-4M24 20v-4M29 20v-4"/>'
      + '<path d="M24 10c2 3-2 4 0 7"/>'
      + '<path d="M31 8c2 3-2 4 0 7"/>';
  } else if (kind === "bag") {
    s += '<path d="M12 20h24l-2 20a3 3 0 01-3 3H17a3 3 0 01-3-3z"/>'
      + '<path d="M18 20v-3a6 6 0 0112 0v3"/>'
      + '<path d="M19 28h10"/>'
      + '<circle cx="24" cy="34" r="2"/>';
  }
  return s + "</svg>";
}

var STORIES = [
  {
    id: "leo", name: "Leo", icon: "spray", color: "#38bdf8",
    crime: { en: "Graffiti", es: "Grafiti" },
    story: {
      en: [
        "The hiss of the spray can was a secret language in the silent alley. Leo pressed the nozzle, the cold mist painting a vibrant, angry streak of cobalt blue against the sterile beige brick of the new bank. His design, a complex web of interlocking letters, flowed from muscle memory. For ten minutes, the only sounds were the rattle of the can as he shook it and the sharp scent of aerosol paint cutting through the night air. He worked fast, his body a blur of motion, layering crimson and gold over the blue.",
        "He took one step back, his breath fogging in the chill, to admire his work. The piece was alive, a burst of defiant color on a bland canvas. A distant siren made him flinch, the brief surge of pride instantly replaced by a jolt of fear. Grabbing his backpack full of cans, he melted back into the shadows of the side streets, leaving his screaming, vibrant crime to greet the morning sun."
      ],
      es: [
        "El siseo de la lata de aerosol era un lenguaje secreto en el callejón silencioso. Leo apretó la boquilla y la fría neblina pintó una viva y furiosa línea de azul cobalto sobre el estéril ladrillo beige del nuevo banco. Su diseño, una compleja red de letras entrelazadas, brotaba de la memoria muscular. Durante diez minutos, los únicos sonidos fueron el traqueteo de la lata al agitarla y el olor agudo de la pintura en aerosol cortando el aire nocturno. Trabajaba rápido, su cuerpo un borrón de movimiento, superponiendo carmesí y dorado sobre el azul.",

      ]
    },
    answers: {
      en: {
        dc: { ex: "A neighbor's security camera records a person spraying paint on the bank wall.", why: "Directly shows the crime happening, but the figure is too dark to identify as Leo, so it is class evidence." },
        di: { ex: "A traffic camera clearly captures Leo's face as he lifts his mask while shaking the can.", why: "It directly shows the crime and identifies Leo as the person who committed it." },
        cc: { ex: "Spray paint cans of the same rare brand and colors as the graffiti are found in Leo's backpack.", why: "It links Leo to the crime scene indirectly, and the brand of paint is shared by many people." },

      },
      es: {

        di: { ex: "Una cámara de tráfico captura claramente el rostro de Leo al bajarse la máscara mientras agita la lata.", why: "Muestra directamente el delito e identifica a Leo como la persona que lo cometió." },
        cc: { ex: "En la mochila de Leo se encuentran latas de aerosol de la misma marca y colores poco comunes del grafiti.", why: "Vincula a Leo con la escena de forma indirecta, y esa marca de pintura la comparten muchas personas." },
        ci: { ex: "Se levantan las huellas dactilares de Leo de una lata de aerosol dejada en el suelo junto al muro.", why: "Vincula solo a Leo con la escena, pero no lo muestra pintando directamente." }
      }
    }
  },
  {
    id: "clara", name: "Clara", icon: "invoice", color: "#f59e0b",
    crime: { en: "Vendor invoice embezzlement", es: "Desfalco con facturas de proveedores" },
    story: {
      en: [
        "Clara’s office was quiet, the only light coming from her monitor as she worked late again. It wasn’t a dramatic heist, just a quiet series of keystrokes. She created a new vendor in the accounting software: “Mid-Atlantic Paper Solutions.” She drafted a plausible invoice for a bulk order that never existed. With a final click, she approved a payment of $850, routing it not to a supplier, but to a shell account she’d opened a month prior. The numbers on the screen shifted, and it was done.",
        "She logged out, the soft whir of the computer’s fan seeming to amplify the silence. She packed her bag and walked out, nodding to the night janitor. The crime was invisible, weightless, existing only as digital ghosts in the company server. But as she stepped into the cool night, she could feel its phantom weight settling in the pit of her stomach."
      ],
      es: [

        cc: { ex: "Los registros bancarios muestran que los $850 terminaron en una cuenta falsa que Clara abrió un mes antes.", why: "Vincula a Clara con el dinero de forma indirecta, y las cuentas bancarias por sí solas no prueban quién escribió la factura." },
        ci: { ex: "La forensia del teclado recupera las huellas dactilares de Clara en su teclado cerca de la hora del pago.", why: "Muestra que solo Clara tocó ese teclado en ese momento, pero no muestra directamente las pulsaciones del delito." }
      }
    }
  },
  {
    id: "jin", name: "Jin", icon: "wallet", color: "#a78bfa",
    crime: { en: "Pickpocketing", es: "Carterismo" },
    story: {

      ],
      es: [
        "El festival callejero de verano era un caótico mar de sonido, color y gente. Jin se movía entre la multitud como un fantasma. Localizó a su víctima con facilidad: un turista, embelesado con un artista callejero, con la chaqueta abierta y el bolsillo trasero abultado. Jin provocó un leve golpe, que parecía accidental, al apretarse para pasar. En ese único instante de contacto, sus dedos, ligeros y entrenados, se deslizaron en el bolsillo y sacaron la gastada cartera de cuero. Fue un movimiento fluido y único, terminado antes de que el hombre siquiera registrara el contacto.",

        cc: { ex: "Six twenties and a ten are found folded in Jin's pocket, matching the stolen cash exactly.", why: "It links Jin to the theft indirectly, and cash of those denominations is common to many people." },

      es: {

    }

var BOX_ORDER = ["dc", "di", "cc", "ci"];

var state = {
  lang: "en",
  teacher: {}, // storyId -> bool
  route: null  // null = home, else story id
};

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function S() { return STRINGS[state.lang]; }

function setLang(lang) {
  state.lang = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  document.documentElement.lang = lang;
  document.title = S().title;
  document.getElementById("brand-sub").textContent = S().brandSub;
  document.getElementById("lang-en").setAttribute("aria-pressed", String(lang === "en"));
  document.getElementById("lang-es").setAttribute("aria-pressed", String(lang === "es"));
  render();
}

function getStory(id) {
  for (var i = 0; i < STORIES.length; i++) if (STORIES[i].id === id) return STORIES[i];
  return null;
}

function readRoute() {
  var h = (location.hash || "").replace(/^#\/?/, "").toLowerCase();
  return h || null;
}

function navHome() { location.hash = "/"; }

function render() {
  var app = document.getElementById("app");
  state.route = readRoute();
  var story = state.route ? getStory(state.route) : null;
  if (state.route && !story) {
    // Unknown route: show home
    state.route = null;
  }
  app.innerHTML = story ? storyHTML(story) : homeHTML();
  bindEvents(story);
}

function homeHTML() {
  var t = S();
  var h = '<section class="framing">'
    + '<p class="eyebrow">' + esc(t.framingEyebrow) + '</p>'
    + '<p>' + esc(t.framingText) + '</p>'
    + '</section>'
    + '<p class="home-prompt">' + esc(t.homePrompt) + '</p>'
    + '<div class="home-grid">';
  for (var i = 0; i < STORIES.length; i++) {
    var st = STORIES[i];
    h += '<a class="story-card" href="#/' + st.id + '" style="--card-c:' + st.color + '">'
      + '<span class="card-icon">' + icon(st.icon, 40, st.color) + '</span>'
      + '<span class="card-name">' + esc(st.name) + '</span>'
      + '<span class="card-crime">' + esc(st.crime[state.lang]) + '</span>'
      + '<span class="card-group">' + esc(t.groupPrefix) + ' ' + esc(st.name) + '</span>'
      + '</a>';
  }
  return h + '</div>';
}

function storyHTML(st) {
  var t = S();
  var show = !!state.teacher[st.id];
  var h = '<button type="button" class="back-link" id="back-btn">&larr; ' + esc(t.back) + '</button>'
    + '<div class="story-head" style="--story-c:' + st.color + '">'
    + '<span class="head-icon">' + icon(st.icon, 52, st.color) + '</span>'
    + '<div><h2>' + esc(st.name) + '</h2>'
    + '<span class="crime-tag">' + esc(st.crime[state.lang]) + '</span></div>'
    + '</div>'
    + '<div class="story-text">';
  for (var i = 0; i < st.story[state.lang].length; i++) {
    h += '<p>' + esc(st.story[state.lang][i]) + '</p>';
  }
  h += '</div>'
    + '<div class="task-bar"><strong>' + esc(t.taskPrefix) + '</strong> ' + esc(t.taskText) + '</div>'
    + '<div class="boxes">';
  for (var j = 0; j < BOX_ORDER.length; j++) {
    var key = BOX_ORDER[j];
    var label = t.boxLabels[key];
    var ans = show ? st.answers[state.lang][key] : null;
    h += '<div class="ev-box' + (ans ? ' filled' : '') + '">'
      + '<div class="box-label' + (ans ? ' filled-label' : '') + '">' + esc(label) + '</div>';
    if (ans) {
      h += '<div class="box-body answer"><strong>' + esc(ans.ex) + '</strong><br>'
        + '<span class="ans-why">' + esc(ans.why) + '</span></div>';
    } else {
      h += '<div class="box-body box-hint">' + esc(t.boxHint) + '</div>';
    }
    h += '</div>';
  }
  h += '</div>'
    + '<div class="teacher-bar">'
    + '<label class="switch">'
    + '<input type="checkbox" id="teacher-toggle"' + (show ? ' checked' : '') + '>'
    + '<span class="slider"></span>'
    + '</label>'
    + '<span class="t-label">' + esc(t.teacherLabel) + '</span>'
    + '</div>';
  return h;
}

function bindEvents(story) {
  if (story) {
    document.getElementById("back-btn").addEventListener("click", navHome);
    var tg = document.getElementById("teacher-toggle");
    if (tg) {
      tg.addEventListener("change", function () {
        state.teacher[story.id] = tg.checked;
        render();
      });
    }
  }
}

/* ---------- Init ---------- */
(function init() {
  var saved = null;
  try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
  if (saved === "en" || saved === "es") state.lang = saved;

  document.getElementById("lang-en").addEventListener("click", function () { if (state.lang !== "en") setLang("en"); });
  document.getElementById("lang-es").addEventListener("click", function () { if (state.lang !== "es") setLang("es"); });

  window.addEventListener("hashchange", render);

  // Teacher answers default OFF every load, never persisted.
  render();
})();
</script>
