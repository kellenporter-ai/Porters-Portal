<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outage at the Waterfront · Apagón en la Costa</title>
<style>
:root{
  --paper:#F4F3EF; --ink:#1A1A1A;
  --ink-soft:rgba(26,26,26,.62); --ink-faint:rgba(26,26,26,.38);
  --accent:#FF4D26;
  --dash:1px dashed rgba(26,26,26,.34);
  --ok:#1E7F3C; --err:#C22F2F; --warn:#B47000;
  --card:#FFFFFF;
  --hot:#C22F2F; --neu:#3B6EA5; --gnd:#1E7F3C;
  --hdr:66px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.45;
  padding-bottom:40px;
}
h1,h2,h3,h4{margin:0; letter-spacing:-0.02em;}
.display{font-weight:800; letter-spacing:-0.03em;}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft);}
button,select,input,textarea{font:inherit; color:var(--ink);}
button{
  background:transparent; border:var(--dash); border-radius:9px;
  padding:10px 15px; cursor:pointer; min-height:44px; min-width:44px;
  font-weight:600;
}
button:hover:not(:disabled){border-color:var(--accent); color:var(--accent);}
button:disabled{opacity:.42; cursor:not-allowed;}
button.primary{background:var(--accent); border:1px solid var(--accent); color:#fff;}
button.primary:hover:not(:disabled){filter:brightness(1.07); color:#fff;}
button.ghost{font-weight:600;}
button.small{min-height:44px; min-width:44px; padding:6px 11px; font-size:13px;}
textarea{width:100%; min-height:64px; resize:vertical; background:#fff; border:var(--dash); border-radius:9px; padding:10px;}
select{min-height:44px; background:#fff; border:var(--dash); border-radius:9px; padding:8px 10px;}
input[type=text]{min-height:44px; background:#fff; border:var(--dash); border-radius:9px; padding:8px 10px; width:100%;}
input[type=range]{width:100%; accent-color:var(--accent); min-height:44px;}
a{color:var(--accent);}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:60; height:var(--hdr);
  display:flex; align-items:center; gap:12px; padding:0 14px;
  background:var(--paper); border-bottom:var(--dash);
}
header .brand{font-weight:800; font-size:16px; letter-spacing:-0.02em; white-space:nowrap;}
header .who{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); min-width:0;}
header .who input,header .who select{min-height:44px; padding:4px 8px; font-size:12.5px; border-radius:7px; width:auto;}
header .who input{width:120px;}
header .spacer{flex:1;}
.langtog{display:inline-flex; border:var(--dash); border-radius:8px; overflow:hidden;}
.langtog button{border:none; border-radius:0; min-height:44px; min-width:44px; padding:4px 10px; font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.langtog button.active{background:var(--accent); color:#fff;}
#permitBtn{font-size:13px;}

/* ---------- stage nav ---------- */
nav.stages{
  position:sticky; top:var(--hdr); z-index:55;
  display:flex; gap:6px; padding:8px 12px; overflow-x:auto;
  background:var(--paper); border-bottom:var(--dash);
}
nav.stages button{
  display:flex; align-items:center; gap:7px; white-space:nowrap;
  min-height:44px; padding:6px 12px; font-size:12.5px; border-radius:999px;
}
nav.stages button.active{border:1px solid var(--accent); color:var(--accent); font-weight:700;}
nav.stages .num{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:999px; background:rgba(26,26,26,.08); font-size:11px; font-weight:800;}
nav.stages button.done .num{background:var(--ok); color:#fff;}
nav.stages button.active .num{background:var(--accent); color:#fff;}

/* ---------- layout ---------- */
main{max-width:1120px; margin:0 auto; padding:16px 14px 60px;}
.stage{display:none;}
.stage.active{display:block;}
.card{background:var(--card); border:var(--dash); border-radius:12px; padding:14px;}
.card + .card{margin-top:12px;}
.card h3{font-size:15px; margin-bottom:2px;}
.sub{font-size:12.5px; color:var(--ink-soft); margin:2px 0 10px;}
.muted{color:var(--ink-soft); font-size:13px;}
.tiny{font-size:11.5px; color:var(--ink-faint);}
.row{display:flex; gap:12px; flex-wrap:wrap;}
.col{display:flex; flex-direction:column; gap:12px; min-width:0;}
.grow{flex:1 1 320px; min-width:0;}
.stack-tight{display:flex; flex-direction:column; gap:8px;}
section.lead{margin-bottom:14px;}
section.lead h2{font-size:22px; margin-bottom:3px;}
section.lead p{margin:0; font-size:13.5px; color:var(--ink-soft); max-width:720px;}

/* ---------- generic interaction bits ---------- */
.traybox{background:#faf9f6; border:var(--dash); border-radius:10px; padding:10px; min-height:84px;}
.traybox .trayhead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  border:var(--dash); background:#fff; border-radius:999px; padding:8px 13px;
  font-size:12.5px; font-weight:600; cursor:grab; min-height:44px;
  display:inline-flex; align-items:center; user-select:none;
}
.chip:active{cursor:grabbing;}
.chip.sel{border:1px solid var(--accent); color:var(--accent); background:#fff5f2;}
.chip.placed{opacity:.45;}
.chip.num{min-width:44px; justify-content:center; border-radius:10px;}
.narration{border-left:3px solid var(--ink); background:#f7f6f1; padding:10px 12px; border-radius:0 10px 10px 0; font-size:13px; margin-top:10px;}
.narration.bad{border-left-color:var(--err);}
.narration.good{border-left-color:var(--ok);}
.narration.warn{border-left-color:var(--warn);}
.narration strong{font-weight:800;}
svg{display:block; max-width:100%;}
svg text{font-family:'Inter',-apple-system,'Segoe UI',Arial,sans-serif;}
/* Presentation attributes are duplicated inline on the SVG nodes themselves,
   because the permit PDF rasterises a clone of these SVGs and a clone carries
   no stylesheet. Anything painted only by these classes would go black. */
.dz{fill:rgba(255,77,38,.05); stroke:rgba(26,26,26,.32); stroke-width:1.5; stroke-dasharray:6 5; cursor:pointer;}
.dz.hover{fill:rgba(255,77,38,.16); stroke:var(--accent);}
.dz.filled{fill:rgba(255,77,38,.06); stroke-width:1.5; stroke-dasharray:none; stroke:rgba(26,26,26,.34);}
.dz-label{font-size:10.5px; fill:rgba(26,26,26,.45); font-weight:700; text-anchor:middle; pointer-events:none;}
.dz-val{font-size:11px; font-weight:800; text-anchor:middle; pointer-events:none;}
.logitem{font-size:12.5px; border-top:1px dashed rgba(26,26,26,.2); padding:7px 0;}
.logitem:first-child{border-top:none;}
.logitem .when{font-weight:800; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint);}
.pdfnote{font-size:11.5px; color:var(--ink-faint); margin-top:8px;}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px;}

/* ---------- stage 2 ---------- */
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft); margin-bottom:8px;}
.legend i{display:inline-block; width:18px; height:4px; border-radius:2px; margin-right:5px; vertical-align:middle;}
.devlist{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.devtag{font-size:11.5px; border:var(--dash); border-radius:999px; padding:3px 9px;}
.devtag.off{opacity:.4;}

/* ---------- stage 3 ---------- */
.pinrow{display:flex; flex-wrap:wrap; gap:8px;}
table.ledger{width:100%; border-collapse:collapse; font-size:12.5px;}
table.ledger th{font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft); text-align:left; border-bottom:1.5px solid var(--ink); padding:6px 6px;}
table.ledger td{border-bottom:1px dashed rgba(26,26,26,.22); padding:7px 6px; vertical-align:top;}
table.ledger td select{min-height:40px; font-size:12px; width:100%; min-width:150px;}
table.ledger tr.active td{background:#fff5f2;}

/* ---------- stage 4 ---------- */
.srcrow{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px dashed rgba(26,26,26,.2);}
.srcrow:first-child{border-top:none;}
.srcrow .nm{flex:0 0 132px; font-weight:700; font-size:13px;}
.srcrow .meta{flex:0 0 172px; font-size:11px; color:var(--ink-soft); line-height:1.3;}
.srcrow input[type=range]{flex:1 1 120px; min-width:110px;}
.srcrow .pct{flex:0 0 52px; text-align:right; font-weight:800; font-size:13px;}
.bar{height:14px; border-radius:7px; background:#eeece6; display:flex; overflow:hidden; border:var(--dash);}
.bar span{display:block; height:100%;}
.outrow{display:flex; align-items:baseline; gap:8px; font-size:13px; margin-top:4px;}
.outrow b{font-size:18px; font-weight:800;}
.nodelist{display:flex; flex-wrap:wrap; gap:8px;}
.gauge{font-size:22px; font-weight:800;}

/* ---------- stage 5 ---------- */
.predgrid{display:grid; grid-template-columns:1fr; gap:10px;}
@media(min-width:720px){.predgrid{grid-template-columns:repeat(3,1fr);}}
.predcard{border:var(--dash); border-radius:10px; padding:10px;}
.predcard .q{font-size:12.5px; font-weight:700; margin-bottom:8px; min-height:34px;}
.optrow{display:flex; flex-direction:column; gap:6px;}
.optrow button{min-height:44px; font-size:12.5px; text-align:left; border-radius:8px;}
.optrow button.picked{border:1.5px solid var(--accent); color:var(--accent); background:#fff5f2;}
.chargepanel{display:flex; gap:16px; flex-wrap:wrap;}

/* ---------- permit ---------- */
#permitBtn.ready{background:var(--accent); border-color:var(--accent); color:#fff;}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; z-index:200; display:none; align-items:flex-start; justify-content:center; background:rgba(26,26,26,.42); padding:24px 14px; overflow:auto;}
.overlay.open{display:flex;}
.modal{background:var(--paper); border-radius:14px; width:min(880px,100%); padding:18px; box-shadow:0 20px 60px rgba(0,0,0,.24); margin:auto;}
.modal h3{font-size:18px; margin-bottom:6px;}
.modal .close{align-self:flex-end;}
.modal .sheet{background:#fff; border:var(--dash); border-radius:10px; padding:16px; font-size:12.5px;}
.modal .sheet h4{font-size:14px; margin:14px 0 4px;}
.modal .sheet h4:first-child{margin-top:0;}
.modal .sheet table{width:100%; border-collapse:collapse; margin:6px 0 4px;}
.modal .sheet th{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); text-align:left; border-bottom:1.5px solid var(--ink); padding:5px 5px;}
.modal .sheet td{border-bottom:1px dashed rgba(26,26,26,.25); padding:5px 5px; vertical-align:top;}
.modal .sheet .note{white-space:pre-wrap;}
.modal .sheet img{max-width:100%; border:var(--dash); border-radius:8px;}

/* ---------- PDF fallback panel ---------- */
#pdfPanel{position:fixed; right:16px; bottom:16px; z-index:300; width:min(94vw,420px);
  background:var(--card); border:1px solid rgba(26,26,26,.3); border-radius:14px; padding:15px 16px;
  box-shadow:0 14px 44px rgba(0,0,0,.2); display:none;}
#pdfPanel.show{display:block;}
#pdfPanel .pp-msg{font-size:13px; line-height:1.5; margin:0 0 12px;}
#pdfPanel .pp-actions{display:flex; gap:9px; flex-wrap:wrap; align-items:center;}
#pdfPanel a.pp-dl{display:inline-flex; align-items:center; min-height:44px; background:var(--accent); color:#fff; border-radius:999px; padding:8px 18px; font-size:13px; font-weight:700; text-decoration:none;}
#pdfPanel a.pp-tab{display:inline-flex; align-items:center; min-height:44px; background:#fff; color:var(--ink); border:1.5px solid rgba(26,26,26,.3); border-radius:999px; padding:7px 16px; font-size:13px; font-weight:600; text-decoration:none;}
#pdfPanel button.pp-close{margin-left:auto; border:1.5px solid rgba(26,26,26,.3); border-radius:999px; color:var(--ink-soft); min-width:44px; min-height:44px; font-size:15px; padding:0;}
#pdfPanel .pp-err{color:var(--err); font-weight:700;}

/* ---------- reference drawer ---------- */
#drawer{position:fixed; top:0; right:0; bottom:0; z-index:250; width:min(430px,94vw);
  background:var(--paper); border-left:var(--dash); box-shadow:-12px 0 40px rgba(0,0,0,.14);
  transform:translateX(102%); transition:transform .24s ease; display:flex; flex-direction:column;}
#drawer.open{transform:translateX(0);}
#drawer .dhead{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:var(--dash);}
#drawer .dhead h3{font-size:15px; flex:1;}
#drawer .dbody{flex:1; overflow:auto; padding:14px; font-size:13px;}
#drawer .dbody ul{margin:6px 0 12px; padding-left:18px;}
#drawer .dbody li{margin:5px 0;}
#drawer .dbody .blk{border:var(--dash); border-radius:10px; padding:10px; background:#fff; margin-bottom:10px;}
#drawer .dbody .blk b{display:block; font-size:12.5px; margin-bottom:3px;}

/* ---------- toast ---------- */
#toast{position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; border-radius:999px; padding:10px 20px; font-size:13px;
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:320; max-width:90vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media(max-width:760px){
  header .brand{display:none;}
  header .who input{width:96px;}
}

/* Hero band: establishing image only. No interaction lives here. */
.hero{position:relative; margin:0 0 18px; border-bottom:1px solid var(--line);}
.hero img{display:block; width:100%; height:210px; object-fit:cover; object-position:center 62%;}
.hero .heroCap{position:absolute; left:14px; bottom:10px; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:#fff; opacity:.92; text-shadow:0 1px 3px rgba(0,0,0,.65);}
@media (max-width:760px){ .hero img{height:150px;} }

.leadline{font-size:13.5px; line-height:1.55;}
.leadgap{height:7px;}
</style>
</head>
<body>

<header>
  <span class="brand" data-i18n="appTitle"></span>
  <div class="who">
    <input id="nameInput" type="text" autocomplete="off" data-i18n-ph="namePh" aria-label="Name">
    <select id="classSel" aria-label="Class">
      <option value="Period 1">Period 1</option>
      <option value="Period 2">Period 2</option>
      <option value="Period 3">Period 3</option>
      <option value="Period 4">Period 4</option>
      <option value="Period 5">Period 5</option>
      <option value="Period 6">Period 6</option>
    </select>
  </div>
  <span class="spacer"></span>
  <div class="langtog" role="group" aria-label="Language">
    <button id="langEn" class="active" data-l="en">EN</button>
    <button id="langEs" data-l="es">ES</button>
  </div>
  <button id="permitBtn" class="ghost" disabled data-i18n="permitBtn"></button>
</header>

<nav class="stages" id="stageNav" aria-label="Stages"></nav>

<main>
<div class="hero" id="heroBand">
  <img id="heroImg" alt="" decoding="async">
</div>



<!-- ============ STAGE 2 ============ -->
<section class="stage active" id="stage2">
  <div class="lead">
    <div class="eyebrow" data-i18n="s2Eyebrow"></div>
    <h2 class="display" data-i18n="s2Title"></h2>
    <p data-i18n="s2Lead" data-i18n-block></p>
  </div>

  <div class="card">
    <div class="btnrow" style="margin-top:0;">
      <span class="eyebrow" data-i18n="s2Layout"></span>
      <button class="small ghost" id="s2Clear" data-i18n="s2Clear"></button>
    </div>

    <div class="row" style="margin-top:12px;">
      <div class="col grow">
        <div class="legend">
          <span><i style="background:var(--hot)"></i><span data-i18n="wireHot"></span></span>
          <span><i style="background:var(--neu)"></i><span data-i18n="wireNeu"></span></span>
          <span><i style="background:var(--gnd)"></i><span data-i18n="wireGnd"></span></span>
        </div>
        <svg id="s2Canvas" viewBox="0 0 760 400" role="img" aria-label="Clinic wall wiring">
          <g id="s2Base"></g>
          <g id="s2Wires"></g>
          <g id="s2Terms"></g>
          <g id="s2Fx"></g>
        </svg>
        <div class="devlist" id="s2DevTags"></div>
      </div>

      <div class="col" style="flex:0 0 268px;">
        <div class="card" style="padding:10px;">
          <div class="eyebrow" data-i18n="s2Tool"></div>
          <div class="sub" style="margin:4px 0 8px;" data-i18n="s2ToolSub"></div>
          <div class="stack-tight">
            <div class="chip" id="s2CurHot" data-w="hot" style="cursor:pointer;"><span data-i18n="wireHot"></span></div>
            <div class="chip" id="s2CurNeu" data-w="neutral" style="cursor:pointer;"><span data-i18n="wireNeu"></span></div>
            <div class="chip" id="s2CurGnd" data-w="ground" style="cursor:pointer;"><span data-i18n="wireGnd"></span></div>
            <div class="chip" id="s2CurErase" data-w="erase" style="cursor:pointer;"><span data-i18n="toolErase"></span></div>
          </div>
          <div class="tiny" style="margin-top:8px;" data-i18n="s2ToolHint"></div>
        </div>
        <div class="card" style="padding:10px;">
          <div class="eyebrow" data-i18n="s2Flips"></div>
          <div id="s2Flips" style="margin-top:6px;"></div>
        </div>
        <div class="card" style="padding:10px;">
          <div class="eyebrow" data-i18n="s2Plug"></div>
          <div class="stack-tight" id="s2PlugBtns" style="margin-top:6px;"></div>
        </div>
      </div>
    </div>

    <div class="btnrow">
      <button class="primary" id="s2Flip" data-i18n="s2Flip"></button>
    </div>
    <div id="s2Narr"></div>

    <label style="display:block;margin-top:12px;font-size:12px;font-weight:700;" data-i18n="s2WhyLabel" for="s2Why"></label>
    <textarea id="s2Why" data-i18n-ph="s2WhyPh"></textarea>
    <div class="pdfnote" data-i18n="s2PdfNote"></div>
  </div>
</section>

<!-- ============ STAGE 4 ============ -->
<section class="stage" id="stage4">
  <div class="lead">
    <div class="eyebrow" data-i18n="s4Eyebrow"></div>
    <h2 class="display" data-i18n="s4Title"></h2>
    <p data-i18n="s4Lead" data-i18n-block></p>
  </div>

  <div class="card">
    <h3 data-i18n="s4bTitle"></h3>
    <div class="sub" data-i18n="s4bSub"></div>
    <div id="s4Plants" style="margin-bottom:10px;">
      <div class="eyebrow" data-i18n="s4Plant"></div>
      <div class="chips" id="s4PlantChips" style="margin-top:6px;"></div>
    </div>
    <div class="traybox">
      <div class="trayhead">
        <span class="eyebrow" data-i18n="s4Tray"></span>
        <button class="small ghost" id="s4ClearChain" data-i18n="clearTray"></button>
      </div>
      <div class="chips" id="s4Tray"></div>
    </div>
    <div class="row" style="margin-top:12px;">
      <div class="col grow">
        <svg id="s4Canvas" viewBox="0 0 860 260" role="img" aria-label="Generator chain">
          <g id="s4Base"></g>
          <g id="s4Zones"></g>
          <g id="s4Vals"></g>
          <g id="s4Fx"></g>
        </svg>
      </div>
      <div class="col" style="flex:0 0 250px;">
        <div class="card" style="padding:10px;">
          <div class="outrow"><span class="muted" data-i18n="s4Out"></span> <b id="s4Out">0</b> <span class="muted">W</span></div>
        </div>
        <button class="primary" id="s4RunChain" data-i18n="s4RunChain"></button>
      </div>
    </div>
    <div id="s4Narr"></div>
    <label id="s4ReflectLabel" style="display:block;margin-top:14px;font-size:12px;font-weight:700;" data-i18n="s4ReflectLabel" for="s4Reflect"></label>
    <textarea id="s4Reflect" data-i18n-ph="s4ReflectPh" style="min-height:84px;"></textarea>
    <div class="pdfnote" data-i18n="s4PdfNote"></div>
  </div>
</section>


</main>

<!-- ============ REFERENCE DRAWER ============ -->
<aside id="drawer" aria-hidden="true" aria-label="Reference">
  <div class="dhead">
    <h3 data-i18n="drawerTitle"></h3>
    <button class="small" id="drawerClose" aria-label="Close">×</button>
  </div>
  <div class="dbody" id="drawerBody"></div>
</aside>

<!-- ============ PERMIT MODAL ============ -->
<div class="overlay" id="permitOverlay">
  <div class="modal">
    <div style="display:flex; align-items:flex-start; gap:12px;">
      <div style="flex:1;">
        <h3 data-i18n="permitTitle"></h3>
        <div class="muted" data-i18n="permitSub" style="margin-bottom:4px;"></div>
      </div>
      <button class="small close" id="permitClose" aria-label="Close">×</button>
    </div>
    <div class="btnrow" style="margin-bottom:12px;">
      <button class="primary" id="permitExport" data-i18n="permitExport"></button>
      <button class="ghost" id="permitPrint" data-i18n="permitPrint"></button>
    </div>
    <div class="sheet" id="permitSheet"></div>
    <div class="pdfnote" data-i18n="permitFoot"></div>
  </div>
</div>

<!-- ============ PDF FALLBACK PANEL ============ -->
<div id="pdfPanel" role="dialog" aria-live="polite">
  <p class="pp-msg" id="pdfPanelMsg"></p>
  <div class="pp-actions">

var LANG = 'en';
function t(key) {
  var pack = T[LANG] || T.en;
  var v = Object.prototype.hasOwnProperty.call(pack, key) ? pack[key] : T.en[key];
  if (v == null) {
    /* A missing key is a build bug. Make it loud in the console and render
       nothing rather than leaking an identifier into student copy. */
    try { console.warn('i18n missing key:', key); } catch (e) {}
    return '';
  }
  return v;
}
function fmt(key, vars) {
  var s = t(key);
  if (!vars) return s;
  Object.keys(vars).forEach(function (k) {
    s = s.split('{' + k + '}').join(String(vars[k]));
  });
  return s;
}
function $(id) { return document.getElementById(id); }
function el(tag, cls, txt) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function svgEl(tag, attrs) {
  var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if (attrs) Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
  return n;
}
function clearNode(n) { while (n && n.firstChild) n.removeChild(n.firstChild); }

/* Fisher-Yates, in place. Used for every option list, chip list, and pin
   placement so no load reproduces the previous arrangement. */
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
function shuffledCopy(arr) { return shuffle(arr.slice()); }
/* Break a label into two balanced lines on a word boundary, never mid-word. */
function splitTwoLines(str) {
  var w = str.split(' ');
  if (w.length < 2) return [str];
  var best = 1, bestDiff = Infinity;
  for (var i = 1; i < w.length; i++) {
    var a = w.slice(0, i).join(' ').length;
    var b = w.slice(i).join(' ').length;
    var d = Math.abs(a - b);
    if (d < bestDiff) { bestDiff = d; best = i; }
  }
  return [w.slice(0, best).join(' '), w.slice(best).join(' ')];
}

var toastTimer = null;
function toast(msg) {
  var n = $('toast');
  n.textContent = msg;
  n.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { n.classList.remove('show'); }, 2400);
}

function todayStr() {
  var d = new Date();
  var m = String(d.getMonth() + 1);
  var day = String(d.getDate());
  if (m.length < 2) m = '0' + m;
  if (day.length < 2) day = '0' + day;
  return d.getFullYear() + '-' + m + '-' + day;
}

/* --- the model itself. Consequences only, never a corrected diagram. --- */
function evaluateModel(state) {
  var placements = state.placements, wires = state.wires;
  var parts = Object.keys(placements).map(function (z) {
    var p = PARTS.filter(function (x) { return x.id === placements[z]; })[0];
    return { zone: z, part: p };
  }).filter(function (o) { return !!o.part; });

  if (parts.length < 2) {
    return { ok: false, reason: 'needmore', txt: t('s1NeedMore') };
  }
  var decoy = parts.filter(function (o) { return o.part.role === 'decoy'; })[0];
  if (decoy) {
    return { ok: false, reason: 'decoy', zone: decoy.zone, txt: fmt('s1ModelDecoy', { x: t(decoy.part.id) }) };
  }

  /* Get the left to right sequence of modules that are wired in order. */
  var seq = orderedChain(wires);
  var labels = seq.map(function (z) { return zonePartLabel(placements[z]); });

  var hasSource = parts.some(function (o) { return o.part.role === 'source'; });
  var deviceZones = parts.filter(function (o) { return o.part.role === 'device'; }).map(function (o) { return o.zone; });

  if (!hasSource) {
    var firstGap = gapBetween(wires, parts);
    return { ok: false, reason: 'gap', gap: firstGap, txt: fmt('s1ModelGap', { a: '?', b: '?' }) };
  }
  if (seq.length < 2) {
    var g = gapBetween(wires, parts);
    return { ok: false, reason: 'gap', gap: g,
      txt: fmt('s1ModelGap', { a: g && g[0] ? zonePartLabel(placements[g[0]]) : '?', b: g && g[1] ? zonePartLabel(placements[g[1]]) : '?' }) };
  }

  /* direction: does the chain start at the source? */
  var first = seq[0], last = seq[seq.length - 1];
  var reversed = (placements[first]);
  var firstPart = PARTS.filter(function (x) { return x.id === placements[first]; })[0];
  if (firstPart && firstPart.role === 'device') {
    return { ok: false, reason: 'reversed',
      txt: fmt('s1ModelReversed', { a: t(firstPart.id) }) };
  }

  /* chain must reach a device zone */
  var reachesDevice = deviceZones.some(function (z) { return seq.indexOf(z) >= 0; });
  if (!reachesDevice) {
    var gap2 = gapBetween(wires, parts, seq);
    return { ok: false, reason: 'gap', gap: gap2,
      txt: fmt('s1ModelGap', {
        a: gap2 && gap2[0] ? zonePartLabel(placements[gap2[0]]) : '?',
        b: gap2 && gap2[1] ? zonePartLabel(placements[gap2[1]]) : '?'
      }) };
  }

  return {
    ok: true, seq: seq,
    txt: fmt('s1ModelGood', {
      a: zonePartLabel(placements[seq[0]]),
      b: zonePartLabel(placements[seq[1]] || placements[seq[0]]),
      c: zonePartLabel(placements[seq[seq.length - 1]])
    })
  };
}
function zonePartLabel(partId) {
  if (!partId) return '?';
  return t(partId);
}
function partAtZone(zoneKey) {
  return S.s1.placements[zoneKey] || null;
}
function orderedChain(wires) {
  /* Build a simple left-to-right ordering from the wire graph, using the
     zone's horizontal center as the natural sort key. */
  var adj = {};
  wires.forEach(function (w) {
    (adj[w[0]] = adj[w[0]] || []).push(w[1]);
    (adj[w[1]] = adj[w[1]] || []).push(w[0]);
  });
  var hubs = Object.keys(adj);
  if (!hubs.length) return [];
  /* longest simple path by DFS, cheap because the graph is tiny */
  var best = [];
  function dfs(node, path) {
    if (path.length > best.length) best = path.slice();
    (adj[node] || []).forEach(function (nx) {
      if (path.indexOf(nx) >= 0) return;
      path.push(nx); dfs(nx, path); path.pop();
    });
  }
  hubs.forEach(function (h) { dfs(h, [h]); });
  /* orient the path so it runs from the source side toward the device side */
  if (best.length > 1) {
    var a = best[0], b = best[best.length - 1];
    if (isDeviceZone(a) && !isDeviceZone(b)) best.reverse();
  }
  return best;
}
function isDeviceZone(z) {
  var p = partAtZone(z);
  if (!p) return false;
  var part = PARTS.filter(function (x) { return x.id === p; })[0];
  return part && part.role === 'device';
}
function gapBetween(wires, parts, seq) {
  /* Report the pair of placed modules that has no wire between them. */
  var zones = parts.map(function (o) { return o.zone; });
  if (!wires.length && zones.length >= 2) return [zones[0], zones[1]];
  for (var i = 0; i < zones.length; i++) {
    for (var j = i + 1; j < zones.length; j++) {
      var linked = wires.some(function (w) {
        return (w[0] === zones[i] && w[1] === zones[j]) || (w[0] === zones[j] && w[1] === zones[i]);
      });
      if (!linked) return [zones[i], zones[j]];
    }
  }
  return zones.length ? [zones[0], zones[1] || zones[0]] : null;
}

function runModel() {

/* ------------------------------------------------------------------
   Stage 1 resilience. Real numbers, a real pass/fail, and no single
   build that survives everything. Breaking the base model is the first
   step, not the goal: the goal is surviving a stress that broke it.
   ------------------------------------------------------------------ */
var S1_LOADS = [
  { id: 'ld_heater', kw: 1.2 },
  { id: 'ld_fridge', kw: 0.2 },
  { id: 'ld_bank',   kw: 0.4 },
  { id: 'ld_lamp',   kw: 0.1 }
];
var S1_BATTERY_KWH = 10;
var S1_STRIP_AMPS = 15;
var S1_VOLTS = 120;

function s1SheddedKw() {
  /* the student picks which single load load-shedding drops */
  var shed = S.s1.shedLoad;
  if (!shed) return 0;
  var l = S1_LOADS.filter(function (x) { return x.id === shed; })[0];
  return l ? l.kw : 0;
}
function s1ActiveKw() {
  var total = 0;
  for (var i = 0; i < S1_LOADS.length; i++) total += S1_LOADS[i].kw;
  return Math.max(0, total - s1SheddedKw());
}
function s1Amps() { return s1ActiveKw() * 1000 / S1_VOLTS; }
function s1HasUpgrade(id) { return (S.s1.upgrades || []).indexOf(id) >= 0; }

/* returns {pass:bool, need:number, have:number, where:string} */
function s1StressOutcome(key) {
  var kw = s1ActiveKw();
  var base = evaluateModel(S.s1);
  if (!base.ok) return { pass: false, where: 'model', need: 0, have: 0 };

  if (key === 'ice') {
    /* overhead line down 12 h; a buried line is immune, otherwise the battery
       has to carry the clinic for the whole outage */
    if (s1HasUpgrade('up_buried')) return { pass: true, where: 'buried', need: 0, have: 0 };
    if (!s1HasUpgrade('up_battery')) return { pass: false, where: 'line', need: kw * 12, have: 0 };
    return { pass: S1_BATTERY_KWH >= kw * 12, where: 'battery', need: kw * 12, have: S1_BATTERY_KWH };
  }
  if (key === 'demand') {
    /* every load on at once; only shedding reduces the draw */
    var amps = s1Amps();
    return { pass: amps <= S1_STRIP_AMPS, where: 'strip', need: amps, have: S1_STRIP_AMPS };
  }
  /* wind drop: supply gone 3 h */
  if (!s1HasUpgrade('up_battery')) return { pass: false, where: 'supply', need: kw * 3, have: 0 };
  return { pass: S1_BATTERY_KWH >= kw * 3, where: 'battery', need: kw * 3, have: S1_BATTERY_KWH };
}

function runStress(str) {
  if (!S.s1.committed) { toast(t('s1NeedFirst')); return; }
  var res = evaluateModel(S.s1);
  var out = s1StressOutcome(str.key);

  if (!res.ok) {
    detail = res.txt;
  } else if (out.pass) {
    detail = fmt('s1StressPass', {
      s: t(str.label),
      n: (out.where === 'strip' ? out.need.toFixed(1) : out.have.toFixed(1)),
      u: (out.where === 'strip' ? t('s1UnitAmps') : t('s1UnitKwh'))
    });
  } else if (out.where === 'line') {
    detail = fmt('s1FailLine', { n: out.need.toFixed(1), u: t('s1UnitKwh'), h: out.have.toFixed(1) });
  } else if (out.where === 'strip') {
    detail = fmt('s1FailStrip', { n: out.need.toFixed(1), u: t('s1UnitAmps'), h: out.have.toFixed(0) });
  } else {
    detail = fmt('s1FailBattery', { n: out.need.toFixed(1), u: t('s1UnitKwh'), h: out.have.toFixed(1) });
  }

  S.s1.stressed = true;

  });
  /* strip bus bars, three thin rails, drawn quietly */
  /* Anatomy of a real power strip: two flat outer blades (hot, neutral) with the
     round ground pin running down the CENTRE. Ground is never an outer rail. */
  /* Three parallel buses. They never touch, and no two input terminals of
     different conductors may sit on the same bar. */
  base.appendChild(svgEl('line', { x1: 286, y1: 218, x2: 486, y2: 218, stroke: '#1A1A1A', 'stroke-width': 4, opacity: 0.85 }));
  base.appendChild(svgEl('line', { x1: 286, y1: 235, x2: 486, y2: 235, stroke: '#6B6B6B', 'stroke-width': 6, opacity: 0.9 }));

  label(262, 268, t('s2StripTag'), 10, 800, 'rgba(26,26,26,.55)');
  S2_DEVICE_KEYS.forEach(function (d) {

    var nm = svgEl('text', { x: o.x + 18, y: o.y + 22, 'font-size': 13, 'font-weight': 800, fill: '#1A1A1A' });
    nm.textContent = t(d.label);
    base.appendChild(nm);
    var st = S.s2.lastResult;
    var off = S.s2.plugState === d.id || (st && st.dark && st.dark.indexOf(d.id) >= 0);
    if (off) {
      base.appendChild(svgEl('rect', { x: o.x, y: o.y, width: o.w, height: o.h, rx: 10, fill: '#1A1A1A', opacity: 0.12 }));
      var offT = svgEl('text', { x: o.x + 12, y: o.y + 44, 'font-size': 10.5, 'font-weight': 700, fill: '#C22F2F' });
      offT.textContent = '✕';
      base.appendChild(offT);
    }
  });

  /* wires under terminals */
  S.s2.edges.forEach(function (e, idx) {
    var a = termPoint(e[0]), b = termPoint(e[1]);
    var col = e[2] === 'hot' ? '#1A1A1A' : (e[2] === 'neutral' ? '#8A8A8A' : '#1F7A3A');
    /* Offset parallel conductors so hot, neutral and ground never sit on top
       of one another when they run between the same two components. */
    var off = e[2] === 'hot' ? -5 : (e[2] === 'neutral' ? 0 : 5);
    var mx = (a.x + b.x) / 2 + off;
    wires.appendChild(svgEl('path', {
      d: 'M' + a.x + ' ' + a.y + ' L' + mx + ' ' + a.y + ' L' + mx + ' ' + b.y + ' L' + b.x + ' ' + b.y,
      stroke: col, 'stroke-width': 3.5, fill: 'none',

    }));

  S2_OBJECTS.forEach(function (o) {

      var id = termId(o.id, k);
      var c = svgEl('circle', {

        stroke: '#fff', 'stroke-width': 2, style: 'cursor:pointer'
      });

      terms.appendChild(hit);
      c.addEventListener('click', function (ev) { ev.stopPropagation(); onTerminalClick(id); });
      terms.appendChild(c);
      if (o.id === 'strip' || o.id === 'panel') {

function onTerminalClick(id) {

/* --- the wall check. Consequences, never an auto-corrected diagram. --- */
function leadingLabel() {
  var out = t('dev_heater');
  return out;
}
function runStage2WireCheck() {
  var narr = $('s2Narr');
  clearNode(narr);

  var flips = S.s2.flips;
  var edges = S.s2.edges;
  var result = { kind: 'open', dark: [], text: '', cls: 'bad' };

  /* direct hot to panel with no device in between is a short */
  var shorted = edges.some(function (e) {
    var a = e[0], b = e[1];
    if (e[2] !== 'hot') return false;
    var touchesHot = (a === 'panel:hot' && b === 'panel:neutral') || (a === 'panel:neutral' && b === 'panel:hot');
    if (touchesHot) return true;
    if (a === 'strip:hot' && b === 'panel:neutral') return true;
    if (b === 'strip:hot' && a === 'panel:neutral') return true;
    return false;
  });
  /* hot reaches the strip or the devices at all? */
  var hotReaches = edges.some(function (e) {
    var a = e[0], b = e[1];
    if (e[2] !== 'hot') return false;
    if (a === 'players') return false;
    return (a === 'panel:hot' || b === 'panel:hot') && (a !== 'panel:neutral' && b !== 'panel:neutral');
  });

  if (shorted) {
    result.kind = 'short';
    result.text = t('s2Short');
    result.dark = ['heater', 'fridge', 'bank', 'lamp'];
  } else if (!hotReaches) {
    result.kind = 'open';
    result.text = t('s2Open');
    result.dark = ['heater', 'fridge', 'bank', 'lamp'];
  } else {
    /* Which devices have their own hot path back to the panel through the
       strip bars? Series-style skipping (device to device with no strip) has
       no such path. */
    var onStrip = {};
    S2_DEVICE_KEYS.forEach(function (d) {
      var hasStripLink = edges.some(function (e) {
        var t1 = e[0], t2 = e[1];
        var dPlug = termId(d.id, 'hot');
        return (t1 === dPlug && (t2 === 'strip:hot')) || (t2 === dPlug && (t1 === 'strip:hot'));
      });
      /* a device also counts as parallel if the strip is wired hot and it has
         a link to the strip or to the panel that is not a pass-through chain */
      var linkedToBus = edges.some(function (e) {
        var t1 = e[0], t2 = e[1];
        var dPlug = termId(d.id, 'hot');
        var other = (t1 === dPlug) ? t2 : ((t2 === dPlug) ? t1 : null);
        if (!other) return false;
        return other === 'strip:hot' || other === 'panel:hot';
      });
      onStrip[d.id] = linkedToBus;
    });
    var parallelCount = Object.keys(onStrip).filter(function (k) { return onStrip[k]; }).length;
    var stripHotToPanel = edges.some(function (e) {
      return (e[0] === 'strip:hot' && e[1] === 'panel:hot' && e[2] === 'hot') ||
             (e[1] === 'strip:hot' && e[0] === 'panel:hot' && e[2] === 'hot');
    });
    var hasGround = edges.some(function (e) {
      return e[2] === 'ground' && ((e[0] === 'panel:ground' && e[1] === 'strip:ground') || (e[1] === 'panel:ground' && e[0] === 'strip:ground'));
    });

    if (parallelCount >= 3 && stripHotToPanel) {
      result.kind = 'parallel';
      if (hasGround) {
        result.text = t('s2Ok');
        result.cls = 'good';
      } else {
        result.text = t('s2NoGnd');
        result.cls = 'warn';
      }
      if (S.s2.plugState) {
        var dn = t('dev_' + S.s2.plugState);
        result.text = fmt('s2OkUnplug', { d: dn });
        if (!hasGround) result.text = result.text + ' ' + t('s2NoGnd');
      }
      /* every device is alive unless it is unplugged */
      result.dark = S.s2.plugState ? [S.s2.plugState] : [];
    } else {
      result.kind = 'series';
      var firstDark = null;
      var victimName = null;
      if (S.s2.plugState) {
        firstDark = S.s2.plugState;
        victimName = t('dev_' + S.s2.plugState);
      } else {
        firstDark = 'fridge';
        victimName = t('dev_fridge');
      }
      var culpritName = null;
      /* name what the devices pass through, so the sentence is concrete */
      S2_DEVICE_KEYS.forEach(function (d) {
        var dPlug = termId(d.id, 'hot');
        var toOther = edges.some(function (e) {
          var t1 = e[0], t2 = e[1];
          var other = (t1 === dPlug) ? t2 : ((t2 === dPlug) ? t1 : null);
          if (!other) return false;
          return /^heater:|^fridge:|^bank:|^lamp:/.test(other) && other.split(':')[0] !== d.id;
        });
        if (toOther && !culpritName && d.id !== (S.s2.plugState || 'fridge')) culpritName = t(d.label);
      });
      if (!culpritName) culpritName = t('dev_heater');
      result.text = fmt('s2Series', { d: victimName, x: culpritName });
      result.dark = ['heater', 'fridge', 'bank', 'lamp'];
    }
  }

  /* An unplug that leaves everything running is the parallel signal. In a
     series layout, the unplug kills the wall, so the dark set widens. */
  S.s2.lastResult = result;
  S.s2.narr = result.text;
  S.s2.narrCls = result.cls;
  S.s2.ok = result.kind === 'parallel';
  renderStage2Narr();
  drawStage2Canvas();
}

function runStage3() {
  var placedN = Object.keys(S.s3.placed).length;
  var labelledN = S.s3.plan.filter(function (p) {
    var l = S.s3.labels[p.num];
    return S.s3.placed[p.num] && l && l.wrong && l.who;
  }).length;
  if (placedN < 5 || labelledN < 5) { toast(t('s3NeedAll')); return; }

  var results = [];
  var mismatches = [];
  S.s3.plan.slice().sort(function (a, b) { return a.num - b.num; }).forEach(function (p) {
    var label = S.s3.labels[p.num];
    var fault = s3FaultById(p.faultId);
    var isPeople = fault.who === 'people';
    var actualText = isPeople ? t('s3ConsequencePeople') : t('s3ConsequenceGrid');
    var match = label.who === fault.who;
    if (!match) mismatches.push(p.num);
    results.push({ num: p.num, who: label.who, faultId: p.faultId, text: actualText, match: match, people: isPeople });
  });

  S.s3.results = results;
  S.s3.mismatches = mismatches;
  S.s3.run = true;

  if (S.s3.pass1 === null) {
    S.s3.pass1 = {
      labelled: JSON.parse(JSON.stringify(S.s3.labels)),
      mismatches: mismatches.slice(),
      results: results.map(function (r) { return { num: r.num, who: r.who, text: r.text }; })
    };
  }

  if (mismatches.length) {
    S.s3.narr = mismatches.map(function (n) { return fmt('s3Mismatch', { n: n }); }).join(' ');
    S.s3.narrCls = 'bad';
  } else {
    S.s3.narr = t('s3AllMatch');
    S.s3.narrCls = 'good';
  }
  animateFaults(results);
  drawNav(); refreshPermitBtn(); saveAll();
}

function renderStage4Chain() {
  renderStage4Plants();
  var tray = $('s4Tray');
  clearNode(tray);
  /* a step used in N slots needs N cards taken out of the tray */
  var placedCount = {};
  s4ChainNodes.forEach(function (k) {
    var v = S.s4.chain[k];
    if (v) placedCount[v] = (placedCount[v] || 0) + 1;
  });
  var want = activePlant().chain;
  var FILLER = 'n_none';
  /* the correct parts, plus parts from the other plants and two filler cards,
     so the student has to know which route this plant actually takes. Every
     plant gets the fillers, so their presence does not give solar away. */
  var fillerCount = want.filter(function (x) { return x === FILLER; }).length;
  var wantBase = want.filter(function (x) { return x !== FILLER; });
  var pool = CHAIN_NODES.filter(function (n) {
    return n.id !== FILLER &&
      (wantBase.indexOf(n.id) >= 0 || activePlant().spare.indexOf(n.id) >= 0);
  });
  for (var f = 0; f < Math.max(fillerCount, 2); f++) {
    pool.push({ id: FILLER, order: 5 });
  }
  /* a plant that needs the same filler twice must get two copies */
  var checked = {};
  var expanded = [];
  pool.forEach(function (n) {
    var need = wantBase.filter(function (x) { return x === n.id; }).length || 1;
    for (var c = 0; c < need; c++) expanded.push(n);
  });
  shuffledCopy(expanded).forEach(function (n) {
    var used = placedCount[n.id] || 0;
    if (used > 0) { placedCount[n.id] = used - 1; return; }
    var b = el('button', 'chip' + (s4DragNode === n.id ? ' sel' : ''), t(n.id));
    b.type = 'button';
    b.addEventListener('click', function () {
      s4DragNode = (s4DragNode === n.id) ? null : n.id;
      renderStage4Chain();
    });
    tray.appendChild(b);
  });
  if (!tray.firstChild) tray.appendChild(el('span', 'tiny', t('s3AllPlaced')));

  drawStage4Canvas();
  var rf = $('s4Reflect');
  var plantName = t(activePlant().label);
  var lbl = $('s4ReflectLabel');
  if (lbl) lbl.textContent = t('s4ReflectLabel').replace('{plant}', plantName);
  if (rf) {
    rf.setAttribute('placeholder', t('s4ReflectPh').replace('{plant}', plantName));
    S.s4.reflections = S.s4.reflections || {};
    if (rf.value !== (S.s4.reflections[S.s4.plant || 'coal'] || '')) {
      rf.value = S.s4.reflections[S.s4.plant || 'coal'] || '';
    }
  }
  updateS4Output();
}

function drawStage4Canvas() {

  var w = 148, gap = 20, x0 = 20, y = 74, h = 110;
  s4ChainNodes.forEach(function (k, i) {

      });

    if (hasNode) {
      var words = t(S.s4.chain[k]).split('(')[0].trim();
      /* Wrap onto two lines. A single line ran past the box edge on the longer
         part names, which clipped them at 1366 wide. */
      var lines = words.length > 16 ? splitTwoLines(words) : [words];
      var v = svgEl('text', {
        x: x + w / 2, y: y + h / 2 + 4 - (lines.length - 1) * 7,
        'font-size': 11.5, 'font-weight': 800, 'text-anchor': 'middle',
        fill: '#1A1A1A', 'pointer-events': 'none'
      });
      lines.forEach(function (line, li) {
        var ts = svgEl('tspan', { x: x + w / 2, dy: li === 0 ? 0 : 14 });
        ts.textContent = line;
        v.appendChild(ts);
      });
      zones.appendChild(v);
      var rmc = svgEl('circle', { cx: x + w - 14, cy: y + 14, r: 9, fill: 'rgba(26,26,26,.10)', style: 'cursor:pointer' });
      rmc.addEventListener('click', function (ev) {
        ev.stopPropagation();
        delete S.s4.chain[k];
        S.s4.chainCommitted = false;
        renderStage4Chain(); drawNav(); refreshPermitBtn(); saveAll();
      });
      zones.appendChild(rmc);
      var rmT = svgEl('text', {
        x: x + w - 14, y: y + 18,
        'font-size': 11, 'font-weight': 800, 'text-anchor': 'middle',
        fill: 'rgba(26,26,26,.55)', 'pointer-events': 'none'
      });
      rmT.textContent = '×';
      zones.appendChild(rmT);
    }
    if (i < s4ChainNodes.length - 1) {
      base.appendChild(svgEl('path', {
        d: 'M' + (x + w + 3) + ' ' + (y + h / 2) + ' L ' + (x + w + gap - 6) + ' ' + (y + h / 2),
        stroke: 'rgba(26,26,26,.35)', 'stroke-width': 2, 'marker-end': 'url(#s4Arrow)'
      }));
    }
  });
  var defs = svgEl('defs');
  var mk = svgEl('marker', { id: 's4Arrow', markerWidth: 8, markerHeight: 8, refX: 6, refY: 3, orient: 'auto' });
  mk.appendChild(svgEl('path', { d: 'M0,0 L6,3 L0,6 z', fill: 'rgba(26,26,26,.45)' }));
  defs.appendChild(mk);
  base.insertBefore(defs, base.firstChild);
}

function onChainSlotClick(slot) {
  if (!s4DragNode) {
    if (S.s4.chain[slot]) {
      delete S.s4.chain[slot];
      S.s4.chainCommitted = false;
      renderStage4Chain(); drawNav(); refreshPermitBtn(); saveAll();
    }
    return;
  }
  /* Move ONE copy of the tapped part into this slot. Clearing every slot that
     held the same id wiped the first copy when a plant needed the same step
     twice, which is why solar could never hold two fillers. */
  S.s4.chain[slot] = s4DragNode;
  s4DragNode = null;
  S.s4.chainCommitted = false;
  renderStage4Chain(); drawNav(); refreshPermitBtn(); saveAll();
}

function activePlant() {
  return PLANTS[S.s4.plant || 'coal'] || PLANTS.coal;
}
function chainOrderOk() {
  var want = activePlant().chain;
  for (var i = 0; i < s4ChainNodes.length; i++) {
    /* every slot must be filled, and it must match the plant exactly.
       This keeps 'no step needed' from being dropped in mid-chain. */
    if (S.s4.chain[s4ChainNodes[i]] !== want[i]) return false;
  }
  return true;
}
function updateS4Output() {
  var out = 0;
  if (chainOrderOk()) out = 720;   /* a complete correct chain runs */
  $('s4Out').textContent = String(out);
}
function renderStage4Narr() {
  var n = $('s4Narr');
  clearNode(n);
  if (!S.s4.narr) return;
  n.appendChild(el('div', 'narration ' + (S.s4.narrCls || ''), S.s4.narr));
}
function runChain() {
  var filled = s4ChainNodes.filter(function (k) { return !!S.s4.chain[k]; });
  if (filled.length < 4) { toast(t('s4ChainNeed')); return; }
  if (chainOrderOk()) {
    S.s4.narr = t(activePlant().ok);
    S.s4.narrCls = 'good';
    S.s4.chainCommitted = true;
  } else {
    /* name the first slot whose occupant is out of order */
    var badIdx = -1;
    for (var i = 0; i < 4; i++) {
      var node = CHAIN_NODES.filter(function (n) { return n.id === S.s4.chain[s4ChainNodes[i]]; })[0];
      if (!node || node.order !== i + 1) { badIdx = i; break; }
    }
    var label = badIdx >= 0 ? t(S.s4.chain[s4ChainNodes[badIdx]]) : t('n_output');
    S.s4.narr = fmt('s4OrderBad', { label: label });
    S.s4.narrCls = 'bad';
    S.s4.chainCommitted = false;
  }
  updateS4Output();
  renderStage4Narr();
  drawNav(); refreshPermitBtn(); saveAll();
}

function studentName() {
  return (S.student.name || '').trim();
}
function permitNumber() {
  var nm = studentName() || 'x';
  var h = 0;
  for (var i = 0; i < nm.length; i++) h = (h * 31 + nm.charCodeAt(i)) % 100000;
  return String(h).padStart(5, '0');
}

/* SVG to raster data URL, so the PDF embeds a picture in every browser.
   A cloned SVG carries no stylesheet, so computed styles are copied onto the
   clone node by node before serialising. Without this every class-painted
   shape comes out black. */
function snapshotSvg(svgNode, cb, opts) {
  opts = opts || {};
  var outW = opts.width || 900;
  try {
    var clone = svgNode.cloneNode(true);
    var srcNodes = svgNode.querySelectorAll('*');
    var dstNodes = clone.querySelectorAll('*');
    for (var i = 0; i < srcNodes.length && i < dstNodes.length; i++) {
      var cs = window.getComputedStyle(srcNodes[i]);
      var target = dstNodes[i];
      ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap',
       'font-size', 'font-weight', 'font-family', 'text-anchor', 'opacity'].forEach(function (prop) {
        var v = cs.getPropertyValue(prop);
        if (v && v !== 'none' && v !== 'normal' && v !== 'auto') {
          if (prop === 'opacity' && (v === '1' || v === '')) return;
          target.setAttribute(prop, v);
        } else if (prop === 'fill' || prop === 'stroke') {
          if (v) target.setAttribute(prop, v);
        }
      });
    }
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    var vb = (svgNode.getAttribute('viewBox') || '0 0 700 400').split(/\s+/).map(Number);
    var ratio = vb.length === 4 && vb[2] ? vb[3] / vb[2] : 0.5;
    var outH = Math.round(outW * ratio);
    clone.setAttribute('width', String(outW));
    clone.setAttribute('height', String(outH));
    var data = new XMLSerializer().serializeToString(clone);
    var img = new Image();
    img.onload = function () {
      try {
        var cv = document.createElement('canvas');
        cv.width = outW;
        cv.height = outH;
        var cx = cv.getContext('2d');
        cx.fillStyle = '#ffffff';
        cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL('image/jpeg', 0.82));
      } catch (e) { cb(null); }
    };
    img.onerror = function () { cb(null); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(data);
  } catch (e) { cb(null); }
}

function captureAllSnapshots() {
  return new Promise(function (resolve) {
    var jobs = [];
    jobs.push(new Promise(function (res) {
      snapshotSvg($('s1Canvas'), function (u) { S.s1.ridModelUrl = u; res(); });
    }));
    jobs.push(new Promise(function (res) {
      snapshotSvg($('s2Canvas'), function (u) { S.s2.snapshotUrl = u; res(); });
    }));
    jobs.push(new Promise(function (res) {
      snapshotSvg($('s4Canvas'), function (u) { S.s4.chainImgUrl = u; res(); });
    }));
    Promise.all(jobs).then(function () { resolve(); });
  });
}

function exportPermitPdf() {
  var jsPDFCtor = window.jspdf && window.jspdf.jsPDF;
  if (!jsPDFCtor) { showPdfPanel(null, '', true); return; }

  var doc;
  try {
    doc = new jsPDFCtor({ unit: 'pt', format: 'letter' });
  } catch (e) {
    showPdfPanel(null, '', true);
    return;
  }
  var M = 48, W = 612, CW = W - M * 2, BOTTOM = 792 - M, y = M;
  var header = t('permitTitle');

  function newPage() {
    doc.addPage();
    y = M;
  }
  function ensure(h) { if (y + h > BOTTOM) newPage(); }
  function printLines(lines, x, lineH) {
    for (var i = 0; i < lines.length; i++) {
      if (y + lineH > BOTTOM) newPage();
      doc.text(lines[i], x, y);
      y += lineH;
    }
  }
  function heading(text, size, color) {
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(size);
    doc.setTextColor(color[0], color[1], color[2]);
    var lines = doc.splitTextToSize(text, CW);
    printLines(lines, M, size + 3);
    y += 5;
  }
  function label(text) {
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.setTextColor(110, 110, 110);
    printLines(doc.splitTextToSize(text, CW), M, 13);
    y += 1;
  }
  function body(text, indent) {
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10.5);
    doc.setTextColor(26, 26, 26);
    var x = M + (indent || 0);
    printLines(doc.splitTextToSize(text, CW - (indent || 0)), x, 13.5);
    y += 6;
  }
  function rule() {
    ensure(8);
    doc.setDrawColor(200, 198, 190);
    doc.setLineWidth(0.8);
    doc.line(M, y, W - M, y);
    y += 11;
  }
  function imgBlock(url, caption, aspect) {
    label(caption);
    if (!url) { body(t('permitNone'), 10); return; }
    var w = Math.min(400, CW - 20);
    var h = w * (aspect || 0.5);
    ensure(h + 14);
    try { doc.addImage(url, 'JPEG', M + 10, y, w, h); }
    catch (e) {
      try { console.error('permit pdf: image embed failed', e); } catch (e2) {}
      body(t('permitNone'), 10);
      return;
    }
    y += h + 10;
  }
  /* One page per stage: each section opens a fresh page, so a short section
     never leaves a half-empty sheet and the page count is predictable.
     The first section shares page 1 with the header block. */
  var sectionCount = 0;
  function startSection() {
    sectionCount++;
    if (sectionCount > 1) newPage();
  }

  /* header block */
  doc.setFillColor(26, 26, 26);
  doc.rect(0, 0, W, 96, 'F');
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.setTextColor(244, 243, 239);
  doc.text(header, M, 44);
  doc.setFontSize(11);
  doc.setFont('helvetica', 'normal');
  doc.text(t('appTitle'), M, 66);
  doc.setTextColor(255, 77, 38);
  doc.setFont('helvetica', 'bold');
  doc.text(t('teacherName'), W - M, 44, { align: 'right' });
  doc.setTextColor(26, 26, 26);
  y = 126;

  body(t('permitStudent') + ': ' + (studentName() || t('permitNoName')));
  body(t('permitClass') + ': ' + (S.student.cls || '') + '     ' + t('permitDate') + ': ' + todayStr() + '     ' + t('permitPermitId') + ': ' + permitNumber());
  rule();

  /* page 1: One Source, Many Rooms */
  startSection();
  heading(t('permitStage2'), 14, [255, 77, 38]);
  imgBlock(S.s2.snapshotUrl, t('permitWiring'), 400 / 760);
  body(t('permitFlipCount') + ': ' + S.s2.flips, 10);
  if (S.s2.narr) body(S.s2.narr, 10);
  label(t('permitFailure'));
  body(S.s2.why || t('permitNone'), 10);

  /* page 2: the plant the student built and the chain they assembled */
  startSection();
  heading(t('permitStage4'), 14, [255, 77, 38]);
  label(t('permitPlant'));
  body(t(activePlant().label), 11);
  label(t('permitChain'));
  s4ChainNodes.forEach(function (k, i) {
    ensure(18);
    var part = S.s4.chain[k] ? t(S.s4.chain[k]) : t('permitNone');
    body((i + 1) + '.  ' + part, 10);
  });
  imgBlock(S.s4.chainImgUrl, t('permitChainImg'), 400 / 860);
  if (S.s4.narr) body(S.s4.narr, 10);
  label(t('s4ReflectLabel').replace('{plant}', t(activePlant().label)));
  body(((S.s4.reflections || {})[S.s4.plant || 'coal'] || t('permitNone')), 10);

  /* Tail marker. Drawn at a fixed distance above the footer on the LAST page,
     and forced onto its own page when the content above it runs long, so the
     marker is always present in a complete document. */
  if (y > 792 - 92) newPage();
  var tailY = 792 - 62;
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(11);
  doc.setTextColor(26, 26, 26);
  doc.text(t('permitEndMarker'), M, tailY);
  doc.setDrawColor(26, 26, 26);
  doc.setLineWidth(1);
  doc.line(M, tailY + 8, W - M, tailY + 8);

  /* footers */
  var total = doc.getNumberOfPages();
  for (var pg = 1; pg <= total; pg++) {
    doc.setPage(pg);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.setTextColor(110, 110, 110);
    doc.text(t('permitTitle') + '  |  ' + (studentName() || t('permitNoName')) + '  |  ' + pg + ' / ' + total, W / 2, 792 - 26, { align: 'center' });
  }

  var safeName = (studentName() || 'student').replace(/[^\w \-]+/g, '').replace(/\s+/g, '-').slice(0, 40) || 'student';
  var fname = 'Permit-' + safeName + '-Outage-At-The-Waterfront.pdf';

  var blob;
  try {
    blob = doc.output('blob');
  } catch (e) {
    showPdfPanel(null, fname, true);
    return;
  }
  var url;
  try { url = URL.createObjectURL(blob); } catch (e) { url = null; }
  if (!url) { showPdfPanel(null, fname, true); return; }

  /* Auto-download attempt, DOM-attached anchor. Some browsers block this
     silently, which is why the panel below always appears. */
  var clicked = false;
  try {
    var a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    clicked = true;
  } catch (e) { clicked = false; }

  showPdfPanel(url, fname, !clicked);
}

function showPdfPanel(url, fname, failed) {
  var panel = $('pdfPanel');
  var msg = $('pdfPanelMsg');
  var dl = $('pdfPanelDl');
  var tab = $('pdfPanelTab');

  if (window.__pdfPanelUrl) {
    try { URL.revokeObjectURL(window.__pdfPanelUrl); } catch (e) {}
    window.__pdfPanelUrl = null;
  }

  if (!url) {
    msg.textContent = t('permitExportFail');
    msg.className = 'pp-msg pp-err';
    dl.style.display = 'none';
    tab.style.display = 'none';
    panel.classList.add('show');
    return;
  }

  msg.className = 'pp-msg';
  msg.textContent = failed ? t('permitExportFail') : t('permitExportTry');
  dl.style.display = '';
  tab.style.display = '';
  dl.href = url;
  dl.setAttribute('download', fname);
  dl.textContent = t('permitDownload');
  tab.href = url;
  tab.textContent = t('permitOpenTab');
  window.__pdfPanelUrl = url;
  window.__pdfPanelName = fname;
  window.__pdfPanelFailed = failed;
  panel.classList.add('show');
}

/* Re-render the panel's copy on a language switch, keeping the same blob so
   a student does not have to export again to change language. */
function retranslatePdfPanel() {
  var dl = $('pdfPanelDl');
  var tab = $('pdfPanelTab');
  dl.textContent = t('permitDownload');
  tab.textContent = t('permitOpenTab');
  $('pdfPanelClose').setAttribute('aria-label', t('permitCloseAria'));
  if (window.__pdfPanelUrl) {
    $('pdfPanelMsg').textContent = window.__pdfPanelFailed ? t('permitExportFail') : t('permitExportTry');
  } else if ($('pdfPanel').classList.contains('show')) {
    $('pdfPanelMsg').textContent = t('permitExportFail');
  }
}

/* -------------------------------------------------------------------------
   14. REFERENCE DRAWER
   ------------------------------------------------------------------------- */
function openDrawer(anchorStage) {
  var body = $('drawerBody');
  clearNode(body);
  body.appendChild(el('div', 'tiny', t('s1Nav') === '' ? '' : ''));

  var sections = [
    /* Only the two surviving stages. The drawer used to explain five. */
    { id: 'p2', head: 'drawerP2', items: ['drawerP2a', 'drawerP2b', 'drawerP2c', 'drawerP2d'], stage: 1 },
    { id: 'p4', head: 'drawerP4', items: ['drawerP4b'], stage: 2 }
  ];
  /* the stage the student is on rises to the top, the rest stay available */
  sections.sort(function (a, b) {
    if (a.stage === anchorStage) return -1;
    if (b.stage === anchorStage) return 1;
    return a.stage - b.stage;
  });
  sections.forEach(function (s) {
    var blk = el('div', 'blk');
    blk.appendChild(el('b', null, t(s.head)));
    var ul = el('ul');
    s.items.forEach(function (k) { ul.appendChild(el('li', null, t(k))); });
    blk.appendChild(ul);
    body.appendChild(blk);
  });

  var drawer = $('drawer');
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');
}
function closeDrawer() {
  var drawer = $('drawer');
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
}

/* -------------------------------------------------------------------------
   15. WIRING
   ------------------------------------------------------------------------- */
function wireEvents() {
  /* language */
  $('langEn').addEventListener('click', function () { switchLang('en'); });
  $('langEs').addEventListener('click', function () { switchLang('es'); });

  /* student */
  var nameInput = $('nameInput');
  nameInput.value = S.student.name || '';
  nameInput.addEventListener('input', function () {
    S.student.name = nameInput.value;
    saveAll();
  });
  var clsSel = $('classSel');
  if (S.student.cls) clsSel.value = S.student.cls;
  clsSel.addEventListener('change', function () {
    S.student.cls = clsSel.value;
    saveAll();
  });

  /* permit */
  $('permitBtn').addEventListener('click', function () { openPermit(); });
  $('permitClose').addEventListener('click', function () {
    $('permitOverlay').classList.remove('open');
  });
  $('permitOverlay').addEventListener('click', function (ev) {
    if (ev.target === $('permitOverlay')) $('permitOverlay').classList.remove('open');
  });
  $('permitExport').addEventListener('click', function () {
    var btn = this;
    if (btn.disabled) return;
    btn.disabled = true;
    captureAllSnapshots().then(function () {
      buildPermitSheet();
      exportPermitPdf();
      /* Close the sheet so the result panel is not hidden behind it and the
         nav stays reachable. The panel carries the real download links. */
      $('permitOverlay').classList.remove('open');
    }).catch(function (e) {
      try { console.error('permit export failed', e); } catch (e2) {}
      showPdfPanel(null, '', true);
      $('permitOverlay').classList.remove('open');
    }).finally(function () { btn.disabled = false; });
  });
  $('permitPrint').addEventListener('click', function () {
    buildPermitSheet();
    try { window.print(); } catch (e) { toast(t('permitExportFail')); }
  });
  /* Escape always closes the permit sheet and the reference drawer, so a
     student is never trapped behind an overlay. */
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      $('permitOverlay').classList.remove('open');
      closeDrawer();
    }
  });
  $('pdfPanelClose').addEventListener('click', function () {
    $('pdfPanel').classList.remove('show');
    if (window.__pdfPanelUrl) {
      try { URL.revokeObjectURL(window.__pdfPanelUrl); } catch (e) {}
      window.__pdfPanelUrl = null;
    }
  });

  /* drawer */
  $('drawerClose').addEventListener('click', closeDrawer);
  /* Wire-tool selector. These listeners were lost when the stage 3 block was
     cut, which left 'hot' permanently selected and made neutral, ground and
     erase dead. */
  [['s2CurHot', 'hot'], ['s2CurNeu', 'neutral'], ['s2CurGnd', 'ground'], ['s2CurErase', 'erase']].forEach(function (pair) {
    var el = $(pair[0]);
    if (!el) return;
    el.addEventListener('click', function () {
      s2WireTool = pair[1];
      s2FirstTerm = null;
      renderStage2();
    });
  });
  var clr = $('s2Clear');
  if (clr) clr.addEventListener('click', function () {
    S.s2.edges = []; S.s2.narr = ''; S.s2.committed = false; S.s2.ok = false;
    S.s2.flips = 0; S.s2.plugState = null; S.s2.breakerPopped = false;
    s2FirstTerm = null;
    renderStage2(); drawNav(); refreshPermitBtn(); saveAll();
  });
  $('s2Flip').addEventListener('click', flipMainSwitch);
  $('s2Why').addEventListener('input', function () { S.s2.why = this.value; saveAll(); });

  /* stage 3 */
  $('s4ClearChain').addEventListener('click', function () {
    S.s4.chain = {}; S.s4.chainCommitted = false; S.s4.narr = ''; s4DragNode = null;
    renderStage4Chain(); drawNav(); refreshPermitBtn(); saveAll();
  });
  $('s4Reflect').addEventListener('input', function () {
    S.s4.reflections = S.s4.reflections || {};
    S.s4.reflections[S.s4.plant || 'coal'] = this.value;
    S.s4.reflect = this.value;
    drawNav(); refreshPermitBtn(); saveAll();
  });
  $('s4RunChain').addEventListener('click', function () {
      runChain();
    toast(t('s4ChainSaved'));
  });

  window.addEventListener('beforeunload', saveAll);
}

function switchLang(lang) {
  LANG = lang;
  applyLang();
  retranslatePdfPanel();
  $('permitSheet') && buildPermitSheet();
  if ($('permitOverlay').classList.contains('open')) buildPermitSheet();
  saveAll();
}

function openPermit() {
  /* Always opens. Blank parts print as "(not filled in)". */
  $('permitOverlay').classList.add('open');
  buildPermitSheet();
}

/* -------------------------------------------------------------------------
   16. BOOT
   ------------------------------------------------------------------------- */
function boot() {
  loadAll();
  if (!S.student.cls) S.student.cls = 'Period 1';
  wireEvents();
  applyLang();
  goStage(1);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
