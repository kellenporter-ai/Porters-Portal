    font-size: 13.5px; line-height: 1.42;
    background: var(--tb); color: var(--ink);

    padding: 12px 12px 26px;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }
  .grid-cell:hover {
    transform: translateY(-3px);
    border: 1px solid var(--tc); border-top: 3px solid var(--tc);

  .grid-cell .gist { display: block; }
  .grid-cell .page-ref {

    text-transform: uppercase; color: var(--ink-soft);

  .ladder-summary { border: 0; padding: 0; margin: 0 0 32px; }

  .ladder-row {
    display: flex; gap: 16px; align-items: baseline; padding: 14px 4px;
    border-bottom: var(--dash);
  }
  .ladder-row:first-of-type { border-top: var(--dash); }
  .ladder-row .score-chip { flex: 0 0 auto; }
  .ladder-row p { margin: 0; font-size: 15px; }

  .dl-footer {

  .dl-footer .eyebrow { flex: 0 0 auto; }
  .dl-links { display: flex; gap: 22px; flex-wrap: wrap; }

    body { background: #fff; font-size: 11pt; }
    body.mode-card { font-size: 7.6pt; }
    .wrap { max-width: none; padding: 0; }
    header.top .lang-toggle, .no-print, .screen-view { display: none !important; }

    .panel, .q-card, .q-inner, .tier, .card-doc { border: 1px solid #999; }
    .tier { break-inside: avoid; }
    .question-block { break-before: page; }
    .question-block.first { break-before: auto; }
    .explainer-wrap { break-after: page; }
    .question-block.collapsed .q-inner, .tier-detail.collapsed { display: block !important; }
    .grid-panel { overflow: visible; }
    .grid-cell { min-height: 0; }
    a { color: inherit; text-decoration: none; }
  }

  @media print {
    body.mode-card .print-btn { display: none !important; }
    body.mode-card .card-doc { border: 0; padding: 0; }
    body.mode-card .grid-panel { border: 0; padding: 0; margin: 0; }

    body.mode-card .rubric-grid th.corner { width: 16%; }

    body.mode-card .card-sub { font-size: 7.5pt; margin: 1px 0 6px; }
    body.mode-card .card-ladder .cl { font-size: 5.6pt; padding: 3px 4px; }
    body.mode-card .card-ladder .cl strong { font-size: 5.8pt; }
    body.mode-card .card-footer { font-size: 6pt; margin: 5px 0 0; }
    body.mode-card .explainer-compact { font-size: 6.4pt; margin: 1px 0 4px; line-height: 1.3; }
  }

  @page { margin: 0.4in; }
  @page landscape-page { size: letter landscape; margin: 0.4in; }
  body.mode-card { page: landscape-page; }
</style>

  var map = PDF_PAGES[state.lang];

function printTierHTML(qIdx, tierIdx) {
  var q = DATA[state.lang].questions[qIdx];
  var tier = q.tiers[TIERS[tierIdx].key];
  var S = STR[state.lang];
  var h = '<div class="tier" style="--tc:var(--' + TIERS[tierIdx].key + '-c);--tb:var(--' + TIERS[tierIdx].key + '-b)">' +
    '<div class="tier-body">' +
    '<p class="tier-line"><span class="score-chip">' + esc(tier.chip) + "</span></p>";
  if (tier.title) h += '<p class="tier-line"><strong>' + esc(tier.title) + "</strong></p>";
  var isConnector = function (s) { return /^-(BECAUSE|BUT|AND|OR|PORQUE|PERO|Y|O)-$/.test(s); };
  for (var i = 0; i < tier.lines.length; i++) {
    var ln = tier.lines[i];
    if (isConnector(ln)) {
      h += '<span class="connector">' + esc(S.connectors[ln] || ln) + "</span>";
    } else {
      h += '<p class="tier-line">' + esc(ln) + "</p>";
    }
  }
  if (tier.examples && tier.examples.length) {
    h += '<p class="examples-label">' + esc(S.examplesLabel) + "</p><ul class=\"examples\">";
    for (var j = 0; j < tier.examples.length; j++) {
      h += "<li>" + esc(tier.examples[j]) + "</li>";
    }
    h += "</ul>";
  }
  h += "</div></div>";
  return h;
}

  var q = DATA[state.lang].questions[qIdx];

  for (var j = 0; j < TIERS.length; j++) h += printTierHTML(qIdx, j);
  h += "</div></section>";
  return h;
}

  var S = STR[state.lang];
  var G = GISTS[state.lang];
  var h = '<div class="panel overview"><p class="eyebrow">' + esc(S.overviewLabel) + "</p><p>" + esc(S.overview) + "</p></div>";
  h += explainerHTML(false);
  h += '<div class="panel grid-panel"><table class="rubric-grid"><thead><tr><th class="corner" scope="col"></th>';
  for (var t = 0; t < TIERS.length; t++) {
    h += '<th class="colhead" scope="col" style="' + tierVarsCSS(t) + '">' +
      esc(DATA[state.lang].ladder[t].chip) + "</th>";
  }
  h += "</tr></thead><tbody>";
  for (var q = 0; q < 3; q++) {
    h += '<tr><th class="rowhead" scope="row">' +
      '<span class="row-q">' + esc(S.questionLabel + " " + (q + 1) + " · " + DATA[state.lang].questions[q].q) + "</span>" +
      '<span class="row-gist">' + esc(G.skillGists[q]) + "</span></th>";
    for (var c = 0; c < TIERS.length; c++) {
      h += '<td class="cell"><a class="grid-cell" href="#/q' + (q + 1) + "/t" + c + '" role="link" style="--tc:var(--' + TIERS[c].key + "-c);--tb:var(--" + TIERS[c].key + '-b)">' +
        '<span class="gist">' + esc(G.cells["q" + (q + 1)][c]) + "</span>" +
        pageRefHTML(q, c) + "</a></td>";
    }
    h += "</tr>";
  }
  h += "</tbody></table></div>";
  h += downloadsFooterHTML();
  h += ladderSummaryHTML();
  return h;
}

function downloadsFooterHTML() {
  return "";
}

function detailHTML(qIdx, tierIdx) {
  var S = STR[state.lang];
  var q = DATA[state.lang].questions[qIdx];
  var tier = q.tiers[TIERS[tierIdx].key];
  var flat = qIdx * 5 + tierIdx;
  var prevFlat = flat - 1, nextFlat = flat + 1;
  var maxFlat = DATA[state.lang].questions.length * TIERS.length - 1;
  var hasPrev = prevFlat >= 0, hasNext = nextFlat <= maxFlat;

  var h = '<a class="backlink no-print" href="#/">&larr; ' + esc(S.backToGrid) + "</a>";
  h += '<p class="detail-qnum">' + esc(S.questionLabel + " " + (qIdx + 1)) + "</p>" +
    '<h2 class="detail-q">' + esc(q.q) + "</h2>" +
    '<p class="detail-skill"><strong>' + esc(S.skillLabel) + ":</strong> " + esc(q.skill) + "</p>";
  h += '<div class="detail-head">' +
    '<span class="score-chip" style="' + tierVarsCSS(tierIdx) + '">' + esc(tier.chip) + "</span>" +
    '<span class="detail-score">' + esc(TIERS[tierIdx].score) + "</span></div>";

  h += '<div class="tier" style="--tc:var(--' + TIERS[tierIdx].key + '-c);--tb:var(--' + TIERS[tierIdx].key + '-b)"><div class="tier-body">';
  if (tier.title) h += '<p class="tier-line"><strong>' + esc(tier.title) + "</strong></p>";
  var isConnector = function (s) { return /^-(BECAUSE|BUT|AND|OR|PORQUE|PERO|Y|O)-$/.test(s); };
  for (var i = 0; i < tier.lines.length; i++) {
    var ln = tier.lines[i];
    if (isConnector(ln)) {
      h += '<span class="connector">' + esc(S.connectors[ln] || ln) + "</span>";
    } else {
      h += '<p class="tier-line">' + esc(ln) + "</p>";
    }
  }
  if (tier.examples && tier.examples.length) {
    h += '<p class="examples-label">' + esc(S.examplesLabel) + "</p><ul class=\"examples\">";
    for (var j = 0; j < tier.examples.length; j++) {
      h += "<li>" + esc(tier.examples[j]) + "</li>";
    }
    h += "</ul>";
  }
  var n = pageRefNum(qIdx, tierIdx);
  if (n !== null) {
    h += '<p class="page-ref-line">' + esc(S.pageRefLine.replace("{n}", String(n))) + "</p>";
  }
  h += "</div></div>";

  h += '<nav class="tier-nav no-print" aria-label="' + esc(S.backToGrid) + '">';
  if (hasPrev) {
    h += '<a class="nav-btn" href="#/q' + (Math.floor(prevFlat / 5) + 1) + "/t" + (prevFlat % 5) + '">&larr; ' + esc(S.prevTier) + "</a>";
  } else {
    h += '<span class="nav-btn disabled">&larr; ' + esc(S.prevTier) + "</span>";
  }
  h += '<span class="spacer"></span>';
  h += '<a class="nav-btn primary" href="#/">' + esc(S.backToGrid) + "</a>";
  h += '<span class="spacer"></span>';
  if (hasNext) {
    h += '<a class="nav-btn" href="#/q' + (Math.floor(nextFlat / 5) + 1) + "/t" + (nextFlat % 5) + '">' + esc(S.nextTier) + " &rarr;</a>";
  } else {
    h += '<span class="nav-btn disabled">' + esc(S.nextTier) + " &rarr;</span>";
  }
  h += "</nav>";
  return h;
}

function cardHTML() {
  var S = STR[state.lang];
  var G = GISTS[state.lang];
  var L = DATA[state.lang].ladder;
  var h = '<button type="button" class="print-btn no-print" onclick="window.print()">' + esc(S.printCard) + "</button>";
  h += '<div class="card-doc"><h1>' + esc(S.cardTitle) + "</h1>" +
    '<p class="card-sub">' + esc(S.cardSubtitle) + "</p>";
  h += explainerHTML(true);
  h += '<div class="grid-panel"><table class="rubric-grid"><thead><tr><th class="corner" scope="col"></th>';
  for (var t = 0; t < TIERS.length; t++) {
    h += '<th class="colhead" scope="col" style="' + tierVarsCSS(t) + '">' + esc(L[t].chip) + "</th>";
  }
  h += "</tr></thead><tbody>";
  for (var q = 0; q < 3; q++) {
    h += '<tr><th class="rowhead" scope="row">' +
      '<span class="row-q">' + esc(S.questionLabel + " " + (q + 1) + " · " + DATA[state.lang].questions[q].q) + "</span>" +
      '<span class="row-gist">' + esc(G.skillGists[q]) + "</span></th>";
    for (var c = 0; c < TIERS.length; c++) {
      h += '<td class="cell"><div class="grid-cell" style="--tc:var(--' + TIERS[c].key + "-c);--tb:var(--" + TIERS[c].key + '-b)">' +
        '<span class="gist">' + esc(G.cells["q" + (q + 1)][c]) + "</span>" +
        pageRefHTML(q, c) + "</div></td>";
    }
    h += "</tr>";
  }
  h += "</tbody></table></div>";
  h += '<div class="card-ladder">';
  for (var k = 0; k < L.length; k++) {
    h += '<div class="cl" style="' + tierVarsCSS(k) + '"><strong>' + esc(L[k].chip) + "</strong>" + esc(L[k].text) + "</div>";
  }
  h += "</div>";
  h += '<p class="card-footer">' + esc(S.cardFooter) + "</p>";
  h += "</div>";
  return h;
}

function printDocumentHTML() {
  var S = STR[state.lang];
  var h = '<div class="panel overview"><p class="eyebrow">' + esc(S.overviewLabel) + "</p><p>" + esc(S.overview) + "</p></div>";
  h += '<div class="explainer-wrap">' + explainerHTML(false) + "</div>";
  for (var q = 0; q < 3; q++) h += printQuestionBlockHTML(q);
  h += ladderSummaryHTML();
  return h;
}

function isCardView() {
  return /[?&]view=card/.test(location.search);
}

function parseHash() {
  var m = /^#\/q([1-3])\/t([0-4])$/.exec(location.hash || "");
  if (!m) return null;
  return { q: parseInt(m[1], 10) - 1, t: parseInt(m[2], 10) };
}

function render() {
  var S = STR[state.lang];
  var card = isCardView();
  document.body.classList.toggle("mode-card", card);
  document.documentElement.lang = state.lang;
  document.title = S.pageTitle;
  var titleWords = S.pageTitle.split(" ");
  titleWords[titleWords.length - 1] = '<span class="accent">' + esc(titleWords[titleWords.length - 1]) + "</span>";
  document.getElementById("page-title").innerHTML = titleWords.join(" ");
  document.getElementById("page-sub").textContent = S.pageSub;
  document.getElementById("lang-en").setAttribute("aria-pressed", state.lang === "en");
  document.getElementById("lang-es").setAttribute("aria-pressed", state.lang === "es");

  var h;
  if (card) {
    h = cardHTML();
  } else {
    var route = parseHash();
    if (route) {
      h = '<div class="screen-view">' + detailHTML(route.q, route.t) + "</div>";
    } else {
      if (location.hash && location.hash !== "#/" && location.hash !== "#") {
        try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      }
      h = '<div class="screen-view">' + landingHTML() + "</div>";
    }
    h += '<div class="print-doc" aria-hidden="true">' + printDocumentHTML() + "</div>";
  }
  document.getElementById("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function setLang(lang) {
  state.lang = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  render();
}

document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });
document.getElementById("lang-es").addEventListener("click", function () { setLang("es"); });
window.addEventListener("hashchange", render);

render();
</script>
</body>
</html>
