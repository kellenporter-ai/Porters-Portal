 v₀² + 2aΔx","Δx = v₀t + ½at²"],"correct":2,"expCorrect":"v² = v₀² + 2aΔx contains exactly those four quantities (v, v₀, a, Δx) and no time. It is derived by eliminating t from the other equations.","expWrong":["v = v₀ + at involves time and does not contain displacement.","Δx = ½(v₀ + v)t involves time, which this question asks to avoid.","Δx = v₀t + ½at² involves time, so it does not fit."]},{"id":12,"topic":"Velocity-Time Graphs","stem":"On a velocity-versus-time graph, the area between the curve and the time axis from t = t₁ to t = t₂ gives the object's","options":["total distance traveled over the interval","average speed over the interval","change in acceleration over the interval","displacement over the interval"],"correct":3,"expCorrect":"The area under a velocity-time curve equals velocity times time (for a rectangle) and sums to the net change in position in general. Areas above the axis count positive, areas below count negative, giving the signed displacement.","expWrong":["Total distance adds the areas with their absolute values (no sign). The signed area gives displacement, which is different whenever the object reverses direction.","Average speed is total distance divided by time. It is not the area under the velocity curve.","Change in acceleration would come from the slope of the velocity graph (how the slope changes), not from the area."]},{"id":14,"topic":"Velocity-Time Graphs","stem":"An object's velocity-time graph rises in a straight line from 0 m/s at t = 0 to +6 m/s at t = 3 s, then stays horizontal at +6 m/s until t = 5 s. What is the object's total displacement from t = 0 to t = 5 s?","options":["+21 m","+18 m","+30 m","+9 m"],"correct":0,"expCorrect":"The area is a triangle (0 to 3 s) plus a rectangle (3 to 5 s). Triangle: (1/2)(3 s)(6 m/s) = 9 m. Rectangle: (2 s)(6 m/s) = 12 m. Total: 9 + 12 = 21 m.","expWrong":["+18 m is 3 s × 6 m/s, which treats the whole interval as if the object moved at 6 m/s the entire time, ignoring the ramp-up phase.","+30 m is 5 s × 6 m/s, the same error: using the final velocity for the whole interval instead of finding the true area under the curve.","+9 m is only the triangular part of the area; it ignores the 2 s of motion at +6 m/s."]},{"id":18,"topic":"Velocity-Time Graphs","stem":"An object's velocity is positive but decreasing over a 4 s interval. During this interval, the object","options":["moves in the negative direction and slows down.","moves in the negative direction and speeds up.","is at rest.","moves in the positive direction and slows down."],"correct":3,"expCorrect":"The sign of velocity sets the direction of motion: positive velocity means motion in the positive direction. A decreasing magnitude of velocity means the object is slowing down.","expWrong":["Again, motion in the negative direction requires negative velocity. Positive and decreasing means forward and slowing.","Negative velocity would be required for motion in the negative direction. The velocity here is positive throughout.","An object at rest has zero velocity. A positive, nonzero velocity means the object is moving."]},{"id":29,"topic":"Free Fall","stem":"Stone A is dropped from rest from the top of a tower. At the same instant, stone B is thrown straight downward from the same point with an initial speed of 5 m/s. Neglect air resistance. Which stone has the greater acceleration during the fall?","options":["Stone B, because it was thrown","Both stones have the same acceleration, g","Stone B has a greater acceleration only until it reaches 5 m/s","Stone A, because it was dropped"],"correct":1,"expCorrect":"Once released, both stones are in free fall. Gravity gives both the same constant acceleration g downward, regardless of their initial velocities. Stone B simply starts with a head start in speed.","expWrong":["The throw gives stone B a larger initial velocity, not a larger acceleration. Both accelerate at g the entire time.","There is no such speed threshold: both stones accelerate at g at every instant of the fall.","How an object is launched does not change the gravitational acceleration it experiences after release."]},{"id":32,"topic":"Average Speed, Velocity, and Distance","stem":"An object's displacement over a 10 s interval is zero. Which statement must be true?","options":["The object was at rest the entire interval.","The object's average speed over the interval is zero.","The object's average velocity over the interval is zero.","The object's total distance traveled over the interval is also zero."],"correct":2,"expCorrect":"Average velocity = displacement / time interval. If the displacement is zero, the average velocity is zero, no matter what path the object took in between.","expWrong":["The object could have moved for part of the interval and reversed. All that is required is that it ends at its starting position.","Average speed = total distance / time. The object could have traveled far and returned, giving a positive average speed with zero displacement.","The object could have gone out and come back, covering a large total distance while ending where it started. Zero displacement does not force zero distance."]},{"id":36,"topic":"Average Speed, Velocity, and Distance","stem":"A car's velocity changes uniformly from +60 km/h to -60 km/h over a 2 s interval. What is the car's average velocity over the interval?","options":["+60 km/h","-60 km/h","0","+30 km/h"],"correct":2,"expCorrect":"When acceleration is constant, the average velocity over an interval equals (v₀ + v)/2 = (60 + (−60))/2 = 0. The car moves forward, stops, and moves back, covering equal ground in each direction.","expWrong":["+60 km/h would be the average only if the car stayed at +60 km/h the whole time. Its velocity changes uniformly to -60 km/h.","-60 km/h would be the average only if the car stayed at -60 km/h the whole time.","+30 km/h is (60 − 30), a misapplication of the average formula. The correct formula (v₀ + v)/2 gives 0 for these values."]},{"id":4,"topic":"Position-Time Graphs","stem":"A car's position-time graph is a straight line with a steep positive slope from t = 0 to t = 2 s, then a straight line with a shallower positive slope from t = 2 s to t = 6 s. What is true about the car's motion at t = 2 s?","options":["The car reversed direction.","The car's velocity decreased, but it kept moving in the same direction.","The car's acceleration became negative.","The car came to a complete stop."],"correct":1,"expCorrect":"Velocity is the slope of the position-time graph. Both segments have positive slopes, so the car never reverses. The slope simply becomes smaller in magnitude at t = 2 s, meaning the velocity decreased while staying positive.","expWrong":["Reversing direction would require the slope to change sign (positive to negative). Both slopes here are positive.","A sudden change in velocity does imply a momentary acceleration spike, but the velocity itself stayed positive. The defining feature of the graph is the reduced positive slope, not a negative acceleration as the best description of the motion.","Stopping would appear as a horizontal line (zero slope). The second segment still has a positive slope, so the car is still moving forward."]},{"id":15,"topic":"Velocity-Time Graphs","stem":"An object's velocity-time graph is a straight line from (0 s, 0 m/s) to (4 s, +8 m/s). What is the object's acceleration?","options":["+2 m/s²","+32 m/s²","+8 m/s²","+0.5 m/s²"],"correct":0,"expCorrect":"Acceleration is the slope of the velocity-time graph: Δv/Δt = (8 m/s − 0)/(4 s − 0) = 2 m/s².","expWrong":["+32 m/s² multiplies the two coordinates (8 × 4) instead of dividing them.","+8 m/s² treats the final velocity as if it were the slope. The slope is the change in velocity per unit time, not the velocity itself.","+0.5 m/s² is the reciprocal slope (Δt/Δv), the inverse of what is asked."]}],"frq":{"id":"FRQ","topic":"Multi-Concept Problems","stem":"A cart on a horizontal track has the velocity-versus-time graph shown. The cart starts from rest at t = 0. (a) Calculate the cart's acceleration during the interval from t = 0 s to t = 2 s. Show your work. (b) Calculate the cart's total displacement from t = 0 s to t = 7 s. Show your work. (c) On the axes provided, sketch the cart's acceleration-versus-time graph for the full interval from t = 0 s to t = 7 s. Label your axes.","fig":"<svg viewBox='0 0 480 300' xmlns='http://www.w3.org/2000/svg' role='img' aria-label='Velocity-time graph of a cart: rises from 0 to 4 m/s over 2 s, stays at 4 m/s until 5 s, then falls back to 0 at 7 s'><rect width='480' height='300' fill='white'/><line x1='60' y1='240' x2='440' y2='240' stroke='#333' stroke-width='1.5'/><line x1='60' y1='240' x2='60' y2='30' stroke='#333' stroke-width='1.5'/><polygon points='440,240 432,236 432,244' fill='#333'/><polygon points='60,30 56,38 64,38' fill='#333'/><line x1='60' y1='120' x2='440' y2='120' stroke='#ddd' stroke-width='1'/><text x='40' y='125' font-size='12' fill='#666'>4</text><text x='64' y='125' font-size='12' fill='#666'>m/s</text><line x1='145' y1='240' x2='145' y2='246' stroke='#333'/><text x='141' y='262' font-size='12' fill='#666'>2</text><line x1='290' y1='240' x2='290' y2='246' stroke='#333'/><text x='286' y='262' font-size='12' fill='#666'>5</text><line x1='405' y1='240' x2='405' y2='246' stroke='#333'/><text x='401' y='262' font-size='12' fill='#666'>7</text><text x='448' y='258' font-size='14' fill='#333'>t (s)</text><text x='30' y='40' font-size='14' fill='#333'>v (m/s)</text><polyline points='60,240 145,120 290,120 405,240' fill='none' stroke='#16263e' stroke-width='3'/><text x='60' y='262' font-size='12' fill='#666'>0</text></svg>","parts":[{"label":"Part (a)","prompt":"Calculate the cart's acceleration during the interval from t = 0 s to t = 2 s.","points":2,"model":"a = Δv/Δt = (4 m/s − 0 m/s)/(2 s − 0 s) = +2 m/s²","rubric":"1 point: correct setup (change in velocity divided by the time interval, or a correct slope description of the graph). 1 point: correct value with units: +2 m/s² (accept 2 m/s² in the positive direction)."},{"label":"Part (b)","prompt":"Calculate the cart's total displacement from t = 0 s to t = 7 s.","points":3,"model":"The displacement is the area under the velocity graph. Triangle (0 to 2 s): ½(2 s)(4 m/s) = 4 m. Rectangle (2 to 5 s): (3 s)(4 m/s) = 12 m. Triangle (5 to 7 s): ½(2 s)(4 m/s) = 4 m. Total: 4 + 12 + 4 = 20 m.","rubric":"1 point: identifies the displacement as the area under the velocity-time graph. 1 point: at least one correctly computed piece (4 m or 12 m) with work shown. 1 point: correct total, 20 m, with units."},{"label":"Part (c)","prompt":"Sketch the cart's acceleration-versus-time graph for the full interval from t = 0 s to t = 7 s. Label your axes.","points":3,"model":"A graph with a horizontal line at a = +2 m/s² from t = 0 to t = 2 s, a horizontal line at a = 0 from t = 2 to t = 5 s, and a horizontal line at a = −2 m/s² from t = 5 to t = 7 s. (Vertical transitions at the boundaries are acceptable.)","rubric":"1 point: a-t graph shows +2 m/s² (or equivalent) for 0 to 2 s. 1 point: a-t graph shows a = 0 for 2 to 5 s and −2 m/s² (or equivalent) for 5 to 7 s. 1 point: axes are labeled with correct quantities (a and t) and units."}]}};
const MC = DATA.exam, FRQ = DATA.frq;
const NMC = MC.length;
const STORE = "ap1KinPractice.v1";
const LETTERS = ["A","B","C","D"];
const PARTKEYS = ["a","b","c"];

let S = null;
let view = "welcome";
let cur = 0;
let clockH = null;

function fresh(){ return {v:1, startedAt:null, cur:0, answers:{}, frq:{a:"",b:"",c:""}, marked:[], submitted:null}; }
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE));
    if(s && s.v===1 && s.answers && s.frq) return Object.assign(fresh(), s);
  }catch(e){}
  return null;
}
function save(){ localStorage.setItem(STORE, JSON.stringify(S)); }

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function fmtTime(ms){
  const t = Math.max(0, Math.floor(ms/1000));
  const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), sec = t%60;
  return h + ":" + String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}
function tick(){
  const el = document.getElementById("timer");
  if(el && S && S.startedAt) el.textContent = fmtTime(Date.now() - S.startedAt);
}
function startClock(){
  if(clockH) clearInterval(clockH);
  clockH = setInterval(tick, 1000);
}

function answeredCount(){ return Object.keys(S.answers).length; }
function frqFilled(){ return PARTKEYS.filter(k => S.frq[k] && S.frq[k].trim()).length; }

function render(){
  tick();
  const app = document.getElementById("app");
  const sub = document.getElementById("subhd");
  if(view === "welcome"){
    sub.innerHTML = "";
    app.innerHTML = vWelcome();
    wireWelcome();
  } else if(view === "exam"){
    sub.innerHTML = "Section I: Multiple Choice &nbsp;&middot;&nbsp; <b>75 questions</b> &nbsp;&middot;&nbsp; select one answer per question";
    app.innerHTML = '<div class="wrap">' + vExam() + vSide() + "</div>";
    wireExam(); wireSide();
  } else if(view === "frq"){
    sub.innerHTML = "Section II: Free Response &nbsp;&middot;&nbsp; <b>1 question (8 points)</b> &nbsp;&middot;&nbsp; show all work";
    app.innerHTML = '<div class="wrap">' + vFrq() + vSide() + "</div>";
    wireFrq(); wireSide();
  } else if(view === "results"){
    sub.innerHTML = "Exam submitted &nbsp;&middot;&nbsp; your score and full review are below";
    app.innerHTML = vResults();
    wireResults();
  }
  window.scrollTo({top:0});
}

/* ---------------- welcome ---------------- */
function vWelcome(){
  const hasProg = S && S.startedAt && !S.submitted;
  return `<div class="card welcome">
    <div class="brand">AP&reg; Physics 1: Algebra-Based &nbsp;&middot;&nbsp; Unit 1 Practice</div>
    <h1>Practice Exam: Kinematics, Motion in One Dimension</h1>
    <div class="meta">75 multiple-choice questions + 1 free-response question &nbsp;&middot;&nbsp; styled like the College Board digital exam</div>
    <div class="box">
      <h4>Instructions</h4>
      <ol>
        <li>This is practice: work at your own pace. The clock shows elapsed time, and nothing auto-submits.</li>
        <li>Select one answer per multiple-choice question. You can change answers any time before you submit.</li>
        <li>Use the question navigator to jump between questions, and <b>Mark for Review</b> to flag a question to revisit.</li>
        <li>For the free response, type your work in the response boxes. The symbol bar inserts common physics symbols.</li>
        <li>Use g = 10 m/s&sup2; for free-fall calculations unless a question states otherwise.</li>
        <li>Your progress saves automatically on this device. When finished, click <b>Submit Exam</b>.</li>
      </ol>
    </div>
    <div class="actions">
      <button class="btn primary" id="b-begin" style="font-size:16px;padding:12px 26px">${hasProg ? "Resume Exam" : "Begin Exam"}</button>
      ${hasProg ? '<button class="btn ghost" id="b-reset" style="font-size:16px;padding:12px 20px">Start Over</button>' : ""}
    </div>
  </div>`;
}
function wireWelcome(){
  const b = document.getElementById("b-begin");
  b.onclick = () => {
    if(!S.startedAt){ S.startedAt = Date.now(); }
    save(); view = "exam"; cur = Math.min(S.cur || 0, NMC-1); render(); startClock();
  };
  const r = document.getElementById("b-reset");
  if(r) r.onclick = () => {
    if(confirm("Start over? Your saved answers will be erased.")){ S = fresh(); save(); render(); }
  };
}

/* ---------------- exam (MC) ---------------- */
function vExam(){
  const q = MC[cur];
  const ans = S.answers[cur];
  const marked = S.marked.includes(cur);
  let opts = "";
  q.options.forEach((o,i) => {
    opts += `<button class="opt ${ans===i ? "sel" : ""}" data-i="${i}">
      <span class="radio"></span><span class="ltr">${LETTERS[i]}</span><span class="txt">${esc(o)}</span>
    </button>`;
  });
  return `<div class="main"><div class="card qcard">
    <div class="qhead"><span class="qn">Question ${cur+1} of ${NMC}</span><span class="topic">${esc(q.topic)}</span></div>
    <div class="stem">${esc(q.stem)}</div>
    ${q.fig ? `<div class="fig">${q.fig}</div>` : ""}
    <div>${opts}</div>
    <div class="qfoot">
      <button class="btn mark ${marked ? "on" : ""}" id="b-mark"><span class="flag"></span>${marked ? "Marked for Review" : "Mark for Review"}</button>
      <div class="btnrow">
        <button class="btn ghost" id="b-back">Back</button>
        <button class="btn primary" id="b-next">${cur === NMC-1 ? "Free Response &rarr;" : "Next"}</button>
      </div>
    </div>
  </div></div>`;
}
function wireExam(){
  const card = document.querySelector(".qcard");
  card.querySelectorAll(".opt").forEach(el => {
    el.onclick = () => {
      S.answers[cur] = parseInt(el.dataset.i, 10);
      S.cur = cur; save(); render();
    };
  });
  document.getElementById("b-mark").onclick = () => {
    const i = S.marked.indexOf(cur);
    if(i >= 0) S.marked.splice(i,1); else S.marked.push(cur);
    save(); render();
  };
  document.getElementById("b-back").onclick = () => { if(cur > 0){ cur--; render(); } };
  document.getElementById("b-next").onclick = () => {
    if(cur < NMC-1){ cur++; S.cur = cur; save(); render(); }
    else { view = "frq"; render(); }
  };
}
function examKeys(e){
  if(view !== "exam") return;
  if(e.target && (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT")) return;
  const k = e.key.toLowerCase();
  const map = {a:0, b:1, c:2, d:3, "1":0, "2":1, "3":2, "4":3};
  if(k in map && !e.ctrlKey && !e.metaKey){
    S.answers[cur] = map[k]; S.cur = cur; save(); render();
  }
}

/* ---------------- navigator sidebar ---------------- */
function vSide(){
  const isFrq = view === "frq";
  let cells = "";
  for(let i = 0; i < NMC; i++){
    const done = i in S.answers;
    const curCls = (!isFrq && i === cur) ? "cur" : (isFrq ? "" : "");
    const mk = S.marked.includes(i) ? "mk" : "";
    cells += `<button class="nbtn ${done ? "done" : ""} ${curCls} ${mk}" data-goto="${i}">${i+1}</button>`;
  }
  const frqFilledCls = isFrq ? "cur" : "";
  const frqDoneCls = (frqFilled() === PARTKEYS.length) ? "done" : "";
  cells += `<button class="nbtn frq ${frqDoneCls} ${frqFilledCls}" data-goto="frq">FRQ</button>`;
  const total = answeredCount() + (frqFilled() === PARTKEYS.length ? 1 : 0);
  return `<div class="side"><div class="card" id="navcard">
    <button class="btn ghost navtoggle" id="nav-toggle">Question Navigator (${answeredCount()}/${NMC})</button>
    <h3>Question Navigator</h3>
    <div class="count">Answered: ${total} of ${NMC+1}</div>
    <div class="ngrid">${cells}</div>
    <div class="legend">
      <div class="row"><span class="sw done"></span> Answered</div>
      <div class="row"><span class="sw"></span> Not answered</div>
      <div class="row"><span class="sw cur"></span> Current question</div>
      <div class="row"><span class="sw mk"></span> Marked for review</div>
    </div>
    <button class="btn primary submit" id="b-submit">Submit Exam</button>
  </div></div>`;
}
function wireSide(){
  document.getElementById("navcard").querySelectorAll(".nbtn").forEach(el => {
    el.onclick = () => {
      const g = el.dataset.goto;
      if(g === "frq"){ view = "frq"; render(); }
      else { cur = parseInt(g,10); view = "exam"; S.cur = cur; save(); render(); }
    };
  });
  const t = document.getElementById("nav-toggle");
  if(t) t.onclick = () => document.getElementById("navcard").classList.toggle("open");
  document.getElementById("b-submit").onclick = () => askSubmit();
}

/* ---------------- FRQ ---------------- */
function vFrq(){
  const syms = ["\u0394","\u00BD","\u03B8","\u03C0","\u2248","\u00B1","\u2192","\u00D7","\u00B2","\u2080","m/s","m/s\u00B2"];
  let symlines = "";
  syms.forEach(s => { symlines += `<button type="button" data-sym="${esc(s)}">${esc(s)}</button>`; });
  let parts = "";
  FRQ.parts.forEach((p,i) => {
    const k = PARTKEYS[i];
    parts += `<div class="part">
      <div class="ph"><span class="pl">${esc(p.label)}</span><span class="pts">${p.points} point${p.points>1?"s":""}</span></div>
      <div class="pp">${esc(p.prompt)}</div>
      <div class="symbar" data-for="${k}">${symlines}</div>
      <textarea id="frq-${k}" placeholder="Show your work here...">${esc(S.frq[k])}</textarea>
    </div>`;
  });
  return `<div class="main"><div class="card qcard">
    <div class="qhead"><span class="qn">Free Response Question</span><span class="topic">8 points total</span></div>
    <div class="stem">${esc(FRQ.stem)}</div>
    ${FRQ.fig ? `<div class="fig">${FRQ.fig}</div>` : ""}
    ${parts}
    <div class="frqnote">The free response is self-scored: after you submit, a scoring rubric and model answer are provided so you can grade your own work the way AP readers do.</div>
    <div class="qfoot">
      <span></span>
      <div class="btnrow">
        <button class="btn ghost" id="b-frq-back">&larr; Multiple Choice</button>
      </div>
    </div>
  </div></div>`;
}
function wireFrq(){
  document.getElementById("b-frq-back").onclick = () => { view = "exam"; render(); };
  PARTKEYS.forEach(k => {
    const ta = document.getElementById("frq-" + k);
    ta.addEventListener("input", () => { S.frq[k] = ta.value; save(); });
  });
  document.querySelectorAll(".symbar").forEach(bar => {
    bar.querySelectorAll("button").forEach(btn => {
      btn.onclick = () => {
        const k = bar.dataset.for;
        const ta = document.getElementById("frq-" + k);
        const s = ta.selectionStart, e2 = ta.selectionEnd;
        const ch = btn.dataset.sym;
        ta.value = ta.value.slice(0,s) + ch + ta.value.slice(e2);
        S.frq[k] = ta.value; save();
        ta.focus(); ta.selectionStart = ta.selectionEnd = s + ch.length;
      };
    });
  });
}

/* ---------------- results ---------------- */
function score(){
  let correct = 0;
  MC.forEach((q,i) => { if(S.answers[i] === q.correct) correct++; });
  const byTopic = {};
  MC.forEach((q,i) => {
    if(!byTopic[q.topic]) byTopic[q.topic] = {n:0, c:0};
    byTopic[q.topic].n++;
    if(S.answers[i] === q.correct) byTopic[q.topic].c++;
  });
  let weakest = null, wr = 2;
  Object.keys(byTopic).forEach(t => {
    const r = byTopic[t].c / byTopic[t].n;
    if(r < wr){ wr = r; weakest = t; }
  });
  return {correct, byTopic, weakest, weakestRate: wr};
}

function vResults(){
  const sc = score();
  const pct = Math.round(100 * sc.correct / NMC);
  let rows = "";
  Object.keys(sc.byTopic).forEach(t => {
    const b = sc.byTopic[t];
    const w = Math.round(100 * b.c / b.n);
    rows += `<div class="trow"><div class="tl">${esc(t)}</div><div class="bar"><i style="width:${w}%"></i></div><div class="tv">${b.c}/${b.n}</div></div>`;
  });
  const frqParts = FRQ.parts.map(p =>
    `<tr><td style="padding:6px 10px 6px 0;white-space:nowrap"><b>${esc(p.label)}</b> (${p.points} pts)</td><td style="padding:6px 0">${esc(p.rubric)}</td></tr>`
  ).join("");
  const frqModels = FRQ.parts.map(p =>
    `<div><b>${esc(p.label)}:</b> <div class="model">${esc(p.model)}</div></div>`
  ).join("");
  return `<div class="wrap"><div class="main">
    <div class="card scorecard">
      <div class="sub">Multiple Choice Score</div>
      <div class="big">${sc.correct} / ${NMC} <span style="font-size:18px;font-weight:600;color:var(--muted)">(${pct}%)</span></div>
      <div class="sub">Free Response: self-scored against the rubric below (8 points max).</div>
      <div style="margin-top:20px">
        <div class="sub" style="margin-bottom:8px;font-weight:700;color:var(--navy)">Score by Topic</div>
        ${rows}
      </div>
      ${sc.weakest && sc.weakestRate < 1 ? `<div class="callout"><b>Most room to grow:</b> ${esc(sc.weakest)}. Revisit the related content and try the review explanations below for those questions.</div>` : ""}
      <div class="btnrow" style="margin-top:22px">
        <button class="btn primary" id="b-review">Review Answers</button>
        <button class="btn ghost" id="b-retake">Retake Exam</button>
      </div>
    </div>

    <div class="card rev" id="frq-review">
      <div class="rh"><span class="rq">Free Response Question</span><span class="badge ok">Self-scored</span></div>
      <div class="stem" style="font-size:15px">${esc(FRQ.stem)}</div>
      ${FRQ.fig ? `<div class="fig">${FRQ.fig}</div>` : ""}
      <details open><summary>Your responses</summary><div class="body">
        ${FRQ.parts.map((p,i) => {
          const val = S.frq[PARTKEYS[i]];
          const body = (val && val.trim()) ? esc(val) : "<span style='color:var(--muted)'>no response</span>";
          return "<div style='margin:8px 0'><b>" + esc(p.label) + ":</b><br>" + body + "</div>";
        }).join("")}
      </div></details>
      <details open><summary>Scoring rubric</summary><div class="body">
        <table style="width:100%;border-collapse:collapse;font-size:14px">${frqParts}</table>
      </div></details>
      <details><summary>Show model answer</summary><div class="body">${frqModels}</div></details>
    </div>

    <div id="review-mc"></div>
  </div></div>`;
}

function vReviewMc(){
  let out = "";
  MC.forEach((q,i) => {
    const a = S.answers[i];
    const ok = a === q.correct;
    const badge = (a === undefined || a === null) ? '<span class="badge skip">Skipped</span>' : (ok ? '<span class="badge ok">Correct</span>' : '<span class="badge no">Incorrect</span>');
    let opts = "";
    let wi = 0;
    const wrongExps = [];
    q.options.forEach((o,j) => {
      let cls = "";
      if(j === q.correct) cls = "good";
      else if(j === a) cls = "bad";
      let tag = "";
      if(j === q.correct) tag = '<span class="tagline">Correct answer</span>';
      else if(j === a) tag = '<span class="tagline">Your answer</span>';
      opts += `<div class="opt disabled ${cls}"><span class="radio"></span><span class="ltr">${LETTERS[j]}</span><span class="txt">${esc(o)}${tag}</span></div>`;
      if(j !== q.correct) wrongExps.push({j, t: q.expWrong[wi++]});
    });
    const wlist = wrongExps.map(w => `<li><b>${LETTERS[w.j]}:</b> ${esc(w.t)}</li>`).join("");
    out += `<div class="card rev">
      <div class="rh"><span class="rq">Question ${i+1}</span><span class="topic">${esc(q.topic)}</span>${badge}</div>
      <div class="stem" style="font-size:15.5px">${esc(q.stem)}</div>
      ${q.fig ? `<div class="fig">${q.fig}</div>` : ""}
      ${opts}
      <div class="expl">
        <div><span class="c">Correct: ${LETTERS[q.correct]})</span> ${esc(q.expCorrect)}</div>
        <div style="margin-top:10px"><span class="w">Why the other options are wrong:</span><ul>${wlist}</ul></div>
      </div>
    </div>`;
  });
  document.getElementById("review-mc").innerHTML = out;
}

function wireResults(){
  vReviewMc();
  document.getElementById("b-review").onclick = () => {
    document.getElementById("frq-review").scrollIntoView({behavior:"smooth"});
  };
  document.getElementById("b-retake").onclick = () => {
    if(confirm("Retake the exam? Your submitted answers and responses will be erased.")){
      S = fresh(); save(); view = "welcome"; render();
    }
  };
}

/* ---------------- submit modal ---------------- */
function askSubmit(){
  const a = answeredCount(), f = frqFilled();
  const un = NMC - a;
  const msg = a === NMC && f === PARTKEYS.length
    ? "You have answered all 75 multiple-choice questions and all 3 free-response parts."
    : `You have answered ${a} of 75 multiple-choice questions and ${f} of 3 free-response parts.${un > 0 ? " " + un + " question" + (un>1?"s":"") + " unanswered will be marked as skipped." : ""}`;
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="modal-bg"><div class="modal">
    <h3>Submit Exam?</h3>
    <p>${esc(msg)}<br><br>After you submit, you cannot change your answers. You will see your score and a full review with explanations.</p>
    <div class="actions">
      <button class="btn ghost" id="m-cancel">Keep Working</button>
      <button class="btn warn" id="m-ok">Submit Exam</button>
    </div>
  </div></div>`;
  document.getElementById("m-cancel").onclick = () => { root.innerHTML = ""; };
  document.getElementById("m-ok").onclick = () => {
    S.submitted = {at: Date.now()}; save();
    root.innerHTML = "";
    view = "results"; render();
    if(clockH){ clearInterval(clockH); clockH = null; }
  };
}

/* ---------------- init ---------------- */
S = loadState() || fresh();
if(S.submitted){ view = "results"; }
else if(S.startedAt){ view = "welcome"; }
document.addEventListener("keydown", examKeys);
render();
if(S.startedAt && !S.submitted) startClock();
</script>
</body>
</html>

<script>
/* ---------------- portal bridge ----------------
   iframe integration with the Porters Portal (see Proctor.tsx).
   Works standalone too: when window.parent === window, all of this is a no-op. */
let portalMode = false;
let portalBlockId = null;
let portalReadOnly = false;

function getCurrentState(){
  return JSON.parse(JSON.stringify(S));
}

function importState(data, saveAfter){
  if(!data || typeof data !== "object") return;
  S = Object.assign(fresh(), data);
  if(S.submitted){ view = "results"; }
  else if(S.startedAt){ view = "welcome"; }
  cur = S.cur || 0;
  if(saveAfter !== false) save();
  render();
  if(S.startedAt && !S.submitted) startClock();
}

function setReadOnly(readonly){
  portalReadOnly = readonly;
  document.querySelectorAll("#app button, #app .opt, #app textarea, #app .nbtn, #app .symbar button").forEach(el => {
    el.disabled = readonly;
  });
  document.querySelectorAll("#modal-root button").forEach(el => {
    el.disabled = readonly;
  });
}

function sendToParent(msg){
  if(window.parent !== window){
    window.parent.postMessage(Object.assign({}, msg, {blockId: portalBlockId}), "*");
  }
}

window.addEventListener("message", e => {
  const data = e.data;
  if(!data || typeof data !== "object") return;
  switch(data.type){
    case "portal-init":
      portalMode = true;
      portalBlockId = data.blockId || null;
      if(data.state){
        importState(data.state, false);
      } else {
        // fall back to localStorage state
        const saved = loadState();
        if(saved){ S = saved; render(); }
      }
      if(data.readOnly) setReadOnly(true);
      break;
    case "portal-get-state":
      sendToParent({type: "html-activity-state", state: getCurrentState()});
      break;
    case "portal-set-state":
      if(data.state) importState(data.state, false);
      break;
    case "portal-set-readonly":
      setReadOnly(!!data.readOnly);
      break;
  }
});

// Notify parent that we're ready (in case parent loads after us)
sendToParent({type: "html-activity-ready", blockId: portalBlockId});
</script>
</body>
