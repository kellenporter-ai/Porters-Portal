<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Strip Model Rubric</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F3EF;
    --ink: #1A1A1A;
    --ink-soft: rgba(26, 26, 26, 0.55);
    --ink-faint: rgba(26, 26, 26, 0.35);
    --accent: #FF4D26;
    --dash: 1px dashed rgba(26, 26, 26, 0.35);
    --focus: #FF4D26;
    --t0-c: #dc2626; --t0-b: #fee2e2;
    --t1-c: #d97706; --t1-b: #fef3c7;
    --t2-c: #ca8a04; --t2-b: #fef9c3;
    --t3-c: #059669; --t3-b: #d1fae5;
    --t4-c: #2563eb; --t4-b: #dbeafe;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.55;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  .display, .brand h1, .rubric-grid .row-q, .rubric-grid th.colhead,
  .detail-q, .card-doc h1, .score-chip, .ladder-chip, .nav-btn, .backlink,
  .lang-toggle button, .print-btn, .ladder-summary h2, .eyebrow,
  .detail-qnum, .connector, .page-ref-line, .card-footer, .card-ladder .cl strong {
    font-family: 'Archivo', 'Inter', -apple-system, 'Segoe UI', sans-serif;
  }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 28px 32px 80px; }
  a { color: var(--accent); }

  /* ---------- Header ---------- */
  header.top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 40px;
  }
  .brand h1 {
    font-size: clamp(26px, 3vw, 38px); font-weight: 800; margin: 0;
    letter-spacing: -0.03em; line-height: 1.05;
  }
  .brand h1 .accent { color: var(--accent); }
  .brand .sub {
    color: var(--ink-soft); font-size: 15px; margin-top: 8px; max-width: 52ch;
  }
  .lang-toggle {
    display: inline-flex; align-items: center; border: var(--dash);
    overflow: hidden; flex-shrink: 0;
  }
  .lang-toggle button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    padding: 10px 16px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-soft);
    transition: color 0.2s ease, background 0.2s ease;
  }
  .lang-toggle button + button { border-left: var(--dash); }
  .lang-toggle button[aria-pressed="true"] {
    color: var(--accent); background: rgba(255, 77, 38, 0.06);
  }

  button { font-family: inherit; }
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--focus); outline-offset: 3px;
  }

  body.mode-card header.top { display: none; }

  /* ---------- Eyebrow ---------- */
  .eyebrow {
    text-transform: uppercase; font-size: 11px; font-weight: 600;
    letter-spacing: 0.18em; color: var(--ink-soft); margin: 0 0 10px;
  }

  /* ---------- Panels ---------- */
  .panel {
    background: transparent; border: var(--dash);
    padding: 28px; margin-bottom: 32px;
  }
  .overview { border: 0; padding: 0 0 8px; margin-bottom: 40px; }
  .overview p:last-child { margin: 0; font-size: 17px; max-width: 62ch; }

  /* ---------- Infographic grid ---------- */
  .grid-panel { padding: 22px; overflow-x: auto; margin-bottom: 48px; }
  table.rubric-grid {
    width: 100%; border-collapse: separate; border-spacing: 8px; table-layout: fixed;
  }
  .rubric-grid th.corner { width: 18%; }
  .rubric-grid th.colhead {
    padding: 10px 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
    text-align: center; line-height: 1.25; border: 0;
  }
  .rubric-grid th.rowhead {
    text-align: left; vertical-align: top; padding: 10px 10px 10px 2px; font-weight: 400;
  }
  .rubric-grid .row-q {
    display: block; font-weight: 700; font-size: 15px; line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .rubric-grid .row-gist {
    display: block; color: var(--ink-soft); font-size: 12.5px; margin-top: 6px; line-height: 1.4;
  }
  .rubric-grid td.cell { padding: 0; vertical-align: top; }
  .grid-cell {
    position: relative; display: block; width: 100%; min-height: 104px;
    text-align: left; cursor: pointer; text-decoration: none;
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    font-size: 13.5px; line-height: 1.42;
    background: var(--tb); color: var(--ink);
    border: var(--dash); border-top: 3px solid var(--tc);
    padding: 12px 12px 26px;
    transition: transform 0.3s ease, border-color 0.3s ease;
  }
  .grid-cell:hover {
    transform: translateY(-3px);
    border: 1px solid var(--tc); border-top: 3px solid var(--tc);
  }
  .grid-cell .gist { display: block; }
  .grid-cell .page-ref {
    position: absolute; bottom: 6px; right: 10px;
    font-size: 9px; font-weight: 600; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ink-soft);
    font-family: 'Archivo', 'Inter', sans-serif;
  }

  /* ---------- Tier ladder ---------- */
  .ladder-strip { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 24px; }
  .ladder-chip {
    flex: 1 1 130px; min-width: 120px; text-align: center;
    border: var(--dash); padding: 12px 10px;
    font-weight: 700; font-size: 13px; letter-spacing: 0.01em;
  }
  .ladder-chip small { display: block; font-weight: 600; opacity: 0.75; font-size: 11px; }

  .ladder-summary { border: 0; padding: 0; margin: 0 0 32px; }
  .ladder-summary h2 {
    font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 16px;
  }
  .ladder-row {
    display: flex; gap: 16px; align-items: baseline; padding: 14px 4px;
    border-bottom: var(--dash);
  }
  .ladder-row:first-of-type { border-top: var(--dash); }
  .ladder-row .score-chip { flex: 0 0 auto; }
  .ladder-row p { margin: 0; font-size: 15px; }

  .dl-footer {
    display: flex; gap: 20px; align-items: baseline; flex-wrap: wrap;
    padding: 14px 4px; margin: 0 0 32px;
    border-top: var(--dash); border-bottom: var(--dash);
  }
  .dl-footer .eyebrow { flex: 0 0 auto; }
  .dl-links { display: flex; gap: 22px; flex-wrap: wrap; }
  .dl-links a {
    font-family: 'Archivo', 'Inter', -apple-system, sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--ink-soft); text-decoration: none;
    transition: color 0.2s ease;
  }
  .dl-links a:hover { color: var(--accent); }

  .score-chip {
    display: inline-block; font-weight: 700; font-size: 13px; letter-spacing: 0.01em;
    color: var(--tc); background: var(--tb);
    padding: 6px 16px; white-space: nowrap;
  }

  /* ---------- Detail view ---------- */
  .backlink {
    display: inline-block; margin: 0 0 28px; color: var(--ink-soft);
    text-decoration: none; font-size: 11px; font-weight: 600;
    letter-spacing: 0.15em; text-transform: uppercase;
    border: var(--dash); padding: 10px 18px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  .backlink:hover { color: var(--accent); border-color: var(--accent); }
  .detail-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 0 0 20px; }
  .detail-head .score-chip {
    font-size: 20px; font-weight: 800; letter-spacing: -0.01em; padding: 10px 24px;
  }
  .detail-score {
    font-weight: 800; font-size: 20px; color: var(--ink-faint); letter-spacing: -0.01em;
  }
  .detail-q {
    font-size: clamp(28px, 3.6vw, 44px); font-weight: 800; margin: 0 0 10px;
    letter-spacing: -0.03em; line-height: 1.05; max-width: 22ch;
  }
  .detail-qnum {
    text-transform: uppercase; font-size: 11px; font-weight: 600;
    letter-spacing: 0.18em; color: var(--accent); margin: 0 0 12px;
  }
  .detail-skill {
    color: var(--ink-soft); font-size: 16px; margin: 0 0 24px;
    padding-bottom: 16px; border-bottom: var(--dash); max-width: 62ch;
  }
  .tier {
    border: var(--dash); border-left: 4px solid var(--tc);
    background: transparent; margin-bottom: 12px; overflow: hidden;
  }
  .tier-body { padding: 22px 26px 24px 28px; }
  .tier-line { margin: 0 0 6px; max-width: 68ch; }
  .connector {
    display: block; width: fit-content; margin: 14px auto;
    font-size: 10px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--tc); background: transparent;
    border: 1px dashed var(--tc); padding: 4px 16px;
  }
  .examples-label { font-weight: 700; margin: 18px 0 8px; letter-spacing: -0.01em; }
  .examples {
    margin: 0; padding: 16px 20px 16px 36px; border: var(--dash);
    background: rgba(26, 26, 26, 0.02);
  }
  .examples li { margin-bottom: 6px; }
  .examples li:last-child { margin-bottom: 0; }
  .explainer h2 {
    font-family: 'Archivo', 'Inter', sans-serif;
    font-size: 15pt;
    margin: 0 0 6px;
  }
  .explainer-framing { margin: 0 0 10px; color: var(--ink-soft); }
  .explainer ol { margin: 0; padding-left: 22px; }
  .explainer li { margin: 0 0 8px; line-height: 1.45; }
  .explainer-compact { margin: 2px 0 6px; }

  .page-ref-line {
    color: var(--ink-soft);
    font-size: 11px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
    margin: 16px 0 0;
  }

  .tier-nav { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
  .nav-btn {
    appearance: none; cursor: pointer;
    font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    background: transparent; border: var(--dash);
    padding: 11px 20px; color: var(--ink-soft); text-decoration: none;
    transition: color 0.25s ease, border-color 0.25s ease, transform 0.3s ease;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-3px); }
  .nav-btn.primary { color: var(--ink); border-color: var(--ink-faint); }
  .nav-btn.primary:hover { color: var(--accent); border-color: var(--accent); }
  .nav-btn.disabled { opacity: 0.35; pointer-events: none; }
  .tier-nav .spacer { flex: 1; }

  /* ---------- Card view ---------- */
  .card-doc { background: transparent; border: var(--dash); padding: 24px 26px; }
  .card-doc h1 {
    font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -0.03em; line-height: 1.05;
  }
  .card-sub { color: var(--ink-soft); font-size: 13px; margin: 6px 0 16px; }
  .card-footer {
    color: var(--ink-soft);
    font-size: 10px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    margin: 14px 0 0;
  }
  .card-ladder { display: flex; gap: 8px; margin-top: 14px; }
  .card-ladder .cl {
    flex: 1; border: var(--dash); padding: 8px 9px; font-size: 11px; line-height: 1.35;
  }
  .card-ladder .cl strong { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }
  .print-btn {
    appearance: none; cursor: pointer;
    font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
    background: transparent; color: var(--ink-soft); border: var(--dash);
    padding: 11px 22px; margin-bottom: 16px;
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  .print-btn:hover { color: var(--accent); border-color: var(--accent); }

  .hidden { display: none !important; }

  /* Print-document markup (full linear rubric): hidden on screen */
  .print-doc { display: none; }
  .q-inner .q-text {
    font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px;
  }
  .skill {
    color: var(--ink-soft); font-size: 14px; margin: 0 0 18px;
    padding-bottom: 12px; border-bottom: var(--dash);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }

  @media (max-width: 760px) {
    .wrap { padding: 20px 18px 48px; }
    header.top { margin-bottom: 24px; }
    .grid-panel { padding: 12px; }
  }

  /* ---------- Print: full document (no ?view=card) ---------- */
  @media print {
    body { background: #fff; font-size: 11pt; }
    body.mode-card { font-size: 7.6pt; }
    .wrap { max-width: none; padding: 0; }
    header.top .lang-toggle, .no-print, .screen-view { display: none !important; }
    .print-doc { display: block; }
    .panel, .q-card, .q-inner, .tier, .card-doc { border: 1px solid #999; }
    .tier { break-inside: avoid; }
    .question-block { break-before: page; }
    .question-block.first { break-before: auto; }
    .explainer-wrap { break-after: page; }
    .grid-panel { overflow: visible; }
    .grid-cell { min-height: 0; }
    a { color: inherit; text-decoration: none; }
  }

  /* ---------- Print: card only ---------- */
  @media print {
    body.mode-card .print-btn { display: none !important; }
    body.mode-card .card-doc { border: 0; padding: 0; }
    body.mode-card .grid-panel { border: 0; padding: 0; margin: 0; }
    body.mode-card .rubric-grid { border-spacing: 3px; }
    body.mode-card .rubric-grid th.corner { width: 16%; }
    body.mode-card .rubric-grid th.colhead {
      font-size: 6.6pt; padding: 3px 2px; -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    body.mode-card .rubric-grid th.rowhead { padding: 2px 4px 2px 0; }
    body.mode-card .rubric-grid .row-q { font-size: 6.8pt; }
    body.mode-card .rubric-grid .row-gist { font-size: 6.1pt; margin-top: 1px; }
    body.mode-card .grid-cell {
      font-size: 6.2pt; line-height: 1.25; min-height: 0;
      padding: 4px 4px 11px; border-left-width: 2px; border-top-width: 2px;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    body.mode-card .grid-cell .gist { font-size: 6.2pt; line-height: 1.25; }
    body.mode-card .grid-cell .page-ref { font-size: 5.4pt; bottom: 2px; right: 4px; }
    body.mode-card .card-doc h1 { font-size: 13pt; }
    body.mode-card .card-sub { font-size: 7.5pt; margin: 1px 0 6px; }
    body.mode-card .card-ladder .cl { font-size: 5.6pt; padding: 3px 4px; }
    body.mode-card .card-ladder .cl strong { font-size: 5.8pt; }
    body.mode-card .card-footer { font-size: 6pt; margin: 5px 0 0; }
    body.mode-card .explainer-compact { font-size: 6.4pt; margin: 1px 0 4px; line-height: 1.3; }
  }

  @page { margin: 0.4in; }
  @page landscape-page { size: letter landscape; margin: 0.4in; }
  body.mode-card { page: landscape-page; }
</style>
</head>

var LANG_KEY = "psm-lang";
var state = { lang: "en" };
try {
  var saved = localStorage.getItem(LANG_KEY);
  if (saved === "en" || saved === "es") state.lang = saved;
} catch (e) {}
var urlLang = /[?&]lang=(es|en)/.exec(location.search);
if (urlLang) state.lang = urlLang[1];

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function tierVarsCSS(tierIdx) {
  return "color:var(--" + TIERS[tierIdx].key + "-c);background:var(--" + TIERS[tierIdx].key + "-b)";
}

function pageRefNum(qIdx, tierIdx) {
  var map = PDF_PAGES[state.lang];
  if (!map) return null;
  var v = map["q" + (qIdx + 1) + "-t" + tierIdx];
  return (typeof v === "number") ? v : null;
}

function pageRefHTML(qIdx, tierIdx) {
  var n = pageRefNum(qIdx, tierIdx);
  if (n === null) return "";
  return '<span class="page-ref">p. ' + n + "</span>";
}

function isConnector(s) {
  return /^-(BECAUSE|BUT|AND|OR|PORQUE|PERO|Y|O)-$/.test(s);
}

function tierBodyHTML(tier) {
  var S = STR[state.lang];
  var h = "";
  if (tier.title) h += '<p class="tier-line"><strong>' + esc(tier.title) + "</strong></p>";
  for (var i = 0; i < tier.lines.length; i++) {
    var ln = tier.lines[i];
    if (isConnector(ln)) {
      h += '<span class="connector">' + esc(S.connectors[ln] || ln) + "</span>";
    } else {
      h += '<p class="tier-line">' + esc(ln) + "</p>";
    }
  }
  if (tier.examples && tier.examples.length) {
    h += '<p class="examples-label">' + esc(S.examplesLabel) + "</p><ul class=\"examples\">";
    for (var j = 0; j < tier.examples.length; j++) {
      h += "<li>" + esc(tier.examples[j]) + "</li>";
    }
    h += "</ul>";
  }
  return h;
}

/* ---------- Router ---------- */

function isCardView() {
  return /[?&]view=card/.test(location.search);
}

function parseHash() {
  var m = /^#\/q([1-2])\/t([0-4])$/.exec(location.hash || "");
  if (!m) return null;
  return { q: parseInt(m[1], 10) - 1, t: parseInt(m[2], 10) };
}

function render() {
  var S = STR[state.lang];
  var card = isCardView();
  document.body.classList.toggle("mode-card", card);
  document.documentElement.lang = state.lang;
  document.title = S.pageTitle;
  var titleWords = S.pageTitle.split(" ");
  titleWords[titleWords.length - 1] = '<span class="accent">' + esc(titleWords[titleWords.length - 1]) + "</span>";
  document.getElementById("page-title").innerHTML = titleWords.join(" ");
  document.getElementById("page-sub").textContent = S.pageSub;
  document.getElementById("lang-en").setAttribute("aria-pressed", state.lang === "en");
  document.getElementById("lang-es").setAttribute("aria-pressed", state.lang === "es");

  var h;
  if (card) {
    h = cardHTML();
  } else {
    var route = parseHash();
    if (route) {
      h = '<div class="screen-view">' + detailHTML(route.q, route.t) + "</div>";
    } else {
      if (location.hash && location.hash !== "#/" && location.hash !== "#") {
        try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      }
      h = '<div class="screen-view">' + landingHTML() + "</div>";
    }
    h += '<div class="print-doc" aria-hidden="true">' + printDocumentHTML() + "</div>";
  }
  document.getElementById("app").innerHTML = h;
  window.scrollTo(0, 0);
}

function setLang(lang) {
  state.lang = lang;
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  render();
}

document.getElementById("lang-en").addEventListener("click", function () { setLang("en"); });
document.getElementById("lang-es").addEventListener("click", function () { setLang("es"); });
window.addEventListener("hashchange", render);

render();
</script>
</body>
</html>
